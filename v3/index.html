// ---- 10c. Result ----
const MET = {
  epw:{ l:'Errors / 100 words', good:v=>v<2.5, ok:v=>v<5, d:'C1 < 2.5' },
  fpw:{ l:'Fillers / 100 words', good:v=>v<=4, ok:v=>v<=7, d:'Target ≤ 4' },
  mlu:{ l:'Words per run', good:v=>v>=10, ok:v=>v>=7, d:'Target ≥ 10' },
  lex:{ l:'Lexical score', good:v=>v>=25, ok:v=>v>=15, d:'C1 25–32 / 40' }
};
const mTone = (k,v) => v==null||isNaN(v) ? '' : MET[k].good(v) ? 'ok' : MET[k].ok(v) ? 'warn' : 'bad';
// "wrong -> right" (also → =>) as a struck red part and a green correct part
function exPair(e){ const m=String(e||'').split(/\s*(?:->|→|=>)\s*/);
  return m.length===2&&m[0]&&m[1] ? `<span class="x"><span class="x-w">${esc(m[0])}</span><span class="x-a">→</span><span class="x-r">${esc(m[1])}</span></span>` : `<span class="x"><span class="x-w">${esc(e)}</span></span>`; }
function parseMarks(s){ // [[text|K|Type|Fix|Explanation]] -> html with tappable tokens
  const toks=[]; let html='', last=0; const re=/\[\[(.+?)\]\]/g; let m;
  while((m=re.exec(s))){ html+=esc(s.slice(last,m.index)); last=re.lastIndex;
    const p=m[1].split('|'); const k=(p[1]||'').trim().toUpperCase();
    toks.push({ text:p[0], k, type:p[2], fix:p[3], why:p.slice(4).join('|') });
    html+=`<button class="tok ${k==='S'?'s':'e'}" data-act="spkTok" data-n="${toks.length-1}">${esc(p[0])}</button>`; }
  return { html:html+esc(s.slice(last)), toks };
}
function spkResult(){
  const K=st.K, r=K.result, items=K.items, n=items.length, used=spkUsed(r);
  const m=r.metrics||{}, words=m.words||0;
  const vals={ epw:words?(m.errors_total||0)/words*100:null, fpw:words&&m.fillers!=null?m.fillers/words*100:null, mlu:m.mlu, lex:m.lexical_score };
  K.toks=[];
  const st3={ used:['ok','✓','Used well'], error:['warn','!','Used with an error'], avoided:['bad','–','Not used'] };
  const pmax=Math.max(1,...(r.patterns||[]).map(p=>p.count||0));
  return `<div class="stack spk-res">
    <div class="summary-hero spk-sum">
      <div class="eyebrow">${K.free?'Free talk'+(K.scene?.topic?' · '+esc(K.scene.topic):''):esc(K.scene?.cat||'')} · ${fmtSec(K.audio?.sec||K.sec||0)} · ${esc(r._provider||'')}</div>
      ${K.free?`<div class="n">${esc(r.summary?.cefr||'–')}</div><div class="muted">estimated level of this take</div>`:`<div class="n">${used}<small>/${n}</small></div><div class="muted">targets used well</div>`}
      <div class="row" style="justify-content:center;gap:6px;margin-top:10px">${r.summary?.cefr&&!K.free?`<span class="pill ok">${esc(r.summary.cefr)}</span>`:''}${r._audio===false?'<span class="pill">Text-only analysis</span>':'<span class="pill">Audio analysed</span>'}</div>
      ${r.summary?.headline?`<p class="spk-head">${esc(r.summary.headline)}</p>`:''}
    </div>

    <div class="spk-metrics">${Object.keys(MET).map(k=>`<div class="spk-m ${mTone(k,vals[k])}"><b>${vals[k]==null||isNaN(vals[k])?'–':(k==='lex'?Math.round(vals[k]):Number(vals[k]).toFixed(1))}</b><span>${MET[k].l}</span><small>${MET[k].d}</small></div>`).join('')}</div>

    ${K.free?'':`<section><h3 class="spk-h">Your targets</h3>
    ${(r.targets||[]).map(t=>{ const s=st3[t.status]||st3.avoided; return `<div class="spk-t ${s[0]}"><div class="spk-ti">${s[1]}</div><div class="meta">
      <div class="row" style="justify-content:space-between;gap:6px"><b class="serif">${esc(t.phrase)}</b><span class="pill ${s[0]==='warn'?'new':s[0]==='bad'?'due':'ok'}">${s[2]}${t.t?' · '+esc(t.t):''}</span></div>
      ${t.quote?`<div class="spk-q">“${esc(t.quote)}”</div>`:''}${t.comment?`<div class="muted" style="font-size:.9rem;margin-top:4px">${esc(t.comment)}</div>`:''}
      ${t.native?`<div class="spk-native"><span>Native</span>${esc(t.native)} ${audioBtn(t.native)}</div>`:''}</div></div>`; }).join('')}</section>`}

    ${(r.wins||[]).length?`<section><h3 class="spk-h">What sounded native</h3>${r.wins.map(w=>`<div class="spk-win"><b>“${esc(w.quote)}”</b>${w.type?` <span class="pill">${esc(w.type)}</span>`:''}<div class="muted" style="font-size:.9rem;margin-top:3px">${esc(w.why)}</div></div>`).join('')}</section>`:''}

    ${(r.patterns||[]).length?`<section><h3 class="spk-h">Patterns to fix</h3>${r.patterns.map(p=>`<details class="spk-p ${esc(p.impact||'')}"><summary><span class="code">${esc(p.code)}</span><span class="t">${esc(p.title)}</span><span class="c">×${p.count||1}</span><i style="width:${Math.round((p.count||1)/pmax*100)}%"></i></summary>
      <div class="spk-pb">${p.hook?`<p>${esc(p.hook)}</p>`:''}${(p.examples||[]).length?`<div class="spk-ex">${p.examples.map(exPair).join('')}</div>`:''}${p.fix?`<div class="spk-native"><span>Fix</span>${esc(p.fix)}</div>`:''}</div></details>`).join('')}</section>`:''}

    ${(r.log||[]).length?`<section><h3 class="spk-h">Line by line <small class="muted">tap a highlight</small></h3>${r.log.map((l,j)=>{ const pm=parseMarks(l.original||''); const base=K.toks.length; K.toks.push(...pm.toks);
      const html=pm.html.replace(/data-n="(\d+)"/g,(_,x)=>`data-n="${base+Number(x)}" data-l="${j}"`);
      return `<div class="spk-line"><div class="spk-lt">${esc(l.t||'')}</div><div class="meta"><div class="spk-orig">${html}</div><div class="spk-tx" id="spkTx${j}" hidden></div>
      ${l.native?`<div class="spk-native"><span>Native</span>${esc(l.native)} ${audioBtn(l.native)}</div>`:''}</div></div>`; }).join('')}</section>`:''}

    ${(r.pronunciation||[]).length||(r.prosody||[]).length||(r.pron_risk||[]).length?`<section><h3 class="spk-h">Sound</h3>
      ${(r.pronunciation||[]).map(p=>`<div class="spk-pr"><b>${esc(p.word)}</b> ${audioBtn(p.word)}<span class="ipa">${p.heard?`/${esc(p.heard)}/ → `:''}/${esc(p.target||'')}/</span>${p.risk?`<span class="pill ${p.risk==='high'?'due':''}">${esc(p.type||'')} · ${esc(p.risk)}</span>`:''}<div class="muted" style="font-size:.9rem;width:100%">${esc(p.tip)}</div></div>`).join('')}
      ${(r.pron_risk||[]).length?`<div class="eyebrow" style="margin:8px 0 4px">Predicted risks (no audio was analysed)</div>${r.pron_risk.map(p=>`<div class="spk-pr"><b>${esc(p.word)}</b> ${audioBtn(p.word)}<span class="ipa">/${esc(p.target||'')}/</span><div class="muted" style="font-size:.9rem;width:100%">${esc(p.why)}</div></div>`).join('')}`:''}
      ${(r.prosody||[]).map(p=>`<div class="note"><b>${esc(p.issue)}</b>${p.example?`<em>${esc(p.example)}</em><br>`:''}${esc(p.tip)}</div>`).join('')}</section>`:''}

    ${r.native_version?`<section class="card spk-nv"><div class="row" style="justify-content:space-between"><h3>How a native would tell it</h3>${audioBtn(r.native_version)}</div><p class="serif">${esc(r.native_version)}</p></section>`:''}

    ${(r.next||[]).length?`<section><h3 class="spk-h">Next three moves</h3><ol class="spk-next">${r.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>`:''}

    ${(r.transcript||[]).length?`<details class="card"><summary class="eyebrow" style="cursor:pointer">Full transcript</summary><div class="spk-trans">${r.transcript.map(x=>`<p><span>${esc(x.t||'')}</span>${esc(x.text)}</p>`).join('')}</div></details>`:''}

    ${r._applied&&n?`<p class="hint" style="text-align:center">Review dates updated for ${n} cards.</p>`:''}
    ${K.audio?'<button class="btn soft small" data-act="spkSave" style="align-self:center">'+ICON_SAVE+' Save audio</button>':''}
    <div class="actions"><button class="btn ghost" data-act="spkHome">Main menu</button><button class="btn" data-act="${K.free?'spkFree':'spkNew'}">${K.free?'Talk again':'New set'}</button></div>
  </div>`;
}

// ---- 10d. Actions ----
async function spkEnsureData(){
  for(const d of ['phr','voc']) if(!data[d]) await loadDeck(d);
}
actions.openSpeak = () => { st.K=st.K&&st.K.phase!=='result'&&st.K.phase!=='start'?st.K:{phase:'start'}; go('speak'); };
actions.spkNew = async () => {
  if(st.K?.phase==='rec') return;
  go('loading');
  try{ await spkEnsureData(); }catch(e){ toast('Could not load the sheet: '+e.message); return go('home'); }
  const items=buildSet(); if(items.length<2){ toast('Not enough cards in scope. Check Settings > scope.'); return go('home'); }
  if(st.K?.audio?.url) URL.revokeObjectURL(st.K.audio.url);
  st.K={ phase:'cards', i:0, items, said:{}, scene:spkScene(items), at:Date.now() };
  go('speak');
};
actions.spkFree = () => {
  if(st.K?.phase==='rec') return;
  if(st.K?.audio?.url) URL.revokeObjectURL(st.K.audio.url);
  st.K={ phase:'ready', free:true, items:[], said:{}, scene:spkFreeScene(), at:Date.now() };
  go('speak');
};
actions.spkIdea = d => { const K=st.K, t=K.ideas?.[d.i]; if(!t) return; K.scene.topic=t; render(); };
actions.spkIdeas = () => { st.K.ideas=null; render(); };
actions.spkHome = () => { if(st.K?.audio?.url) URL.revokeObjectURL(st.K.audio.url); st.K={phase:'start'}; go('home'); };
actions.spkNext = () => { const K=st.K; if(K.i<K.items.length-1){ K.i++; render(); } else { K.phase='ready'; go('speak'); } };
actions.spkPrev = () => { const K=st.K; if(K.i>0){ K.i--; render(); } };
actions.spkCardsAgain = () => { st.K.phase='cards'; st.K.i=0; go('speak'); };
actions.spkSaid = (d,el) => { const K=st.K; K.said[d.i]=!K.said[d.i]; document.querySelectorAll(`.spk-chip[data-i="${d.i}"]`).forEach(x=>x.classList.toggle('on',!!K.said[d.i])); buzz(15); };
actions.spkOpen = d => { const s=spkHist()[d.i]; if(!s) return; st.K={ phase:s.result?'result':'start', free:!!s.free, items:s.items, scene:s.free?{...spkFreeScene(s.topic), }:{cat:s.scene}, result:s.result, sec:s.sec, histAt:s.at }; go('speak'); };
actions.spkTok = (d) => {
  const t=st.K.toks?.[d.n], box=$('#spkTx'+d.l); if(!t||!box) return;
  const same=!box.hidden && box.dataset.n===d.n; box.hidden=same; box.dataset.n=d.n;
  document.querySelectorAll(`.tok[data-l="${d.l}"]`).forEach(x=>x.classList.toggle('open', !same && x.dataset.n===d.n));
  box.className='spk-tx '+(t.k==='S'?'s':'e');
  box.innerHTML=`<div class="row" style="gap:6px"><span class="pill ${t.k==='S'?'ok':'due'}">${esc(typeLabel(t.type))}</span>${t.k==='S'?'':`<b class="x-w">${esc(t.text)}</b> <span class="x-a">→</span> <b class="x-r">${esc(t.fix)}</b>`}</div><div style="margin-top:6px">${esc(t.why)}</div>`;
};
// Swipe between cards, arrows on a laptop
let spkX=null;
document.addEventListener('touchstart', e=>{ if(st.view==='speak'&&st.K?.phase==='cards'&&e.target.closest('#spkCard')) spkX=e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{ if(spkX==null) return; const dx=e.changedTouches[0].clientX-spkX; spkX=null; if(Math.abs(dx)>60) (dx<0?actions.spkNext:actions.spkPrev)(); }, {passive:true});
document.addEventListener('keydown', e=>{ if(st.view!=='speak'||e.target.matches('input,textarea')) return; const ph=st.K?.phase;
  if(ph==='cards'){ if(e.key==='ArrowRight'||e.key==='Enter') actions.spkNext(); else if(e.key==='ArrowLeft') actions.spkPrev(); }
  else if(ph==='rec' && e.code==='Space'){ e.preventDefault(); actions.spkPause(); } });

// ---- 10e. Recorder: MediaRecorder + live level meter + wake lock ----
const R = { mr:null, stream:null, chunks:[], t0:0, acc:0, tick:null, ac:null, an:null, raf:null, wake:null, levels:[] };
function recElapsed(){ return R.acc + (st.K?.rec==='on' ? Date.now()-R.t0 : 0); }
function recMime(){ return ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(m=>window.MediaRecorder?.isTypeSupported?.(m))||''; }
actions.spkRec = async () => {
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('This browser cannot record audio. Use the upload option instead.');
  try{ R.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } }); }
  catch(e){ return toast('Microphone access was blocked. Allow it for this site and try again.'); }
  speechSynthesis?.cancel();
  const mime=recMime(); R.mr=new MediaRecorder(R.stream, mime?{ mimeType:mime, audioBitsPerSecond:48000 }:{});
  R.chunks=[]; R.mr.ondataavailable=e=>{ if(e.data.size) R.chunks.push(e.data); };
  R.mr.onstop=()=>{ if(R.discard){ R.discard=false; recCleanup(); return; }
    const type=(R.mr.mimeType||mime||'audio/webm').split(';')[0]; const blob=new Blob(R.chunks,{type});
    const sec=Math.round(recElapsed()/1000); recCleanup();
    st.K.audio={ blob, type, sec, url:URL.createObjectURL(blob) }; st.K.rec=null; st.K.phase='review'; spkSaveHist(); go('speak'); };
  R.mr.start(1000); R.acc=0; R.t0=Date.now(); R.levels=[]; st.K.rec='on'; st.K.phase='rec'; buzz(40); go('speak');
  try{ R.ac=new (window.AudioContext||window.webkitAudioContext)(); const src=R.ac.createMediaStreamSource(R.stream); R.an=R.ac.createAnalyser(); R.an.fftSize=1024; src.connect(R.an); }catch(e){}
  try{ R.wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  R.tick=setInterval(()=>{ const s=recElapsed()/1000; const el=$('#spkTime'); if(el) el.textContent=fmtSec(s); if(s>=SPK.maxSec){ toast('15 minutes reached, stopping.'); actions.spkStop(); } }, 250);
  recDraw();
};
function recDraw(){
  const cv=$('#spkWave');
  if(cv){
    if(R.an){ const buf=new Uint8Array(R.an.fftSize); R.an.getByteTimeDomainData(buf);
      let sum=0; for(const v of buf){ const x=(v-128)/128; sum+=x*x; }
      const lvl=st.K?.rec==='on' ? Math.min(1, Math.sqrt(sum/buf.length)*4) : 0;
      R.f=(R.f||0)+1; if(R.f%3===0){ R.levels.push(lvl); if(R.levels.length>400) R.levels.shift(); } }
    const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(cv.width!==w*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const cs=getComputedStyle(document.documentElement), col=cs.getPropertyValue('--primary').trim()||'#E3120B', mute=cs.getPropertyValue('--line').trim()||'#ccc';
    const bw=3, gap=2, nBars=Math.floor(w/(bw+gap)), L=R.levels.slice(-nBars);
    for(let i=0;i<nBars;i++){ const v=L[i-(nBars-L.length)]; const x=i*(bw+gap);
      if(v==null){ g.fillStyle=mute; g.fillRect(x,h/2-1,bw,2); continue; }
      const bh=Math.max(2, v*(h-6)); g.fillStyle=st.K?.rec==='on'?col:mute; g.beginPath(); g.roundRect?g.roundRect(x,(h-bh)/2,bw,bh,1.5):g.rect(x,(h-bh)/2,bw,bh); g.fill(); }
  }
  if(st.K?.phase==='rec') R.raf=requestAnimationFrame(recDraw);
}
function recCleanup(){ clearInterval(R.tick); cancelAnimationFrame(R.raf); try{ R.stream?.getTracks().forEach(t=>t.stop()); }catch(e){} try{ R.ac?.close(); }catch(e){} try{ R.wake?.release(); }catch(e){} R.an=null; R.ac=null; R.wake=null; }
actions.spkPause = () => { const K=st.K; if(!R.mr) return;
  if(K.rec==='on'){ R.mr.pause(); R.acc+=Date.now()-R.t0; K.rec='paused'; } else if(K.rec==='paused'){ R.mr.resume(); R.t0=Date.now(); K.rec='on'; }
  buzz(20); render(); recDraw(); };
actions.spkStop = () => { if(R.mr && R.mr.state!=='inactive'){ if(st.K.rec==='on'){ R.acc+=Date.now()-R.t0; } st.K.rec='stopped'; R.mr.stop(); buzz(40); } };
actions.spkDiscard = () => { if(!confirm('Discard this recording?')) return; R.discard=true; try{ R.mr.stop(); }catch(e){ recCleanup(); } st.K.rec=null; st.K.phase='ready'; go('speak'); };
actions.spkRedo = () => { if(st.K.audio?.url) URL.revokeObjectURL(st.K.audio.url); st.K.audio=null; st.K.phase='ready'; go('speak'); };
actions.spkSave = async () => {
  const a=st.K.audio; if(!a) return toast('The audio of past sessions is not stored. Save it right after recording.');
  const ext=/mp4|aac|m4a/.test(a.type)?'m4a':/ogg/.test(a.type)?'ogg':/wav/.test(a.type)?'wav':/mpeg|mp3/.test(a.type)?'mp3':'webm';
  const d=new Date(st.K.at||Date.now()), name=`speak-${today(d)}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.${ext}`;
  const file=new File([a.blob], name, {type:a.type});
  if(navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const l=document.createElement('a'); l.href=a.url; l.download=name; document.body.appendChild(l); l.click(); l.remove(); toast('Saved as '+name);
};
function spkUpload(f){
  if(!f) return; if(f.size>19e6) return toast('File is over 19 MB. Trim it or export at a lower bitrate.');
  const url=URL.createObjectURL(f), au=new Audio(); au.preload='metadata'; au.src=url;
  au.onloadedmetadata=()=>{ st.K.audio={ blob:f, type:f.type||'audio/mpeg', sec:Math.round(isFinite(au.duration)?au.duration:0), url }; st.K.phase='review'; spkSaveHist(); go('speak'); };
  au.onerror=()=>{ st.K.audio={ blob:f, type:f.type||'audio/mpeg', sec:0, url }; st.K.phase='review'; go('speak'); };
}
function spkSaveHist(result, extra={}){
  const K=st.K, h=spkHist(), at=K.histAt||K.at; let s=h.find(x=>x.at===at);
  if(!s){ s={ at, items:K.items.map(i=>({deck:i.deck,id:i.id,en:i.en})), scene:K.free?'Free talk'+(K.scene?.topic?': '+K.scene.topic:''):K.scene?.cat||'' }; h.unshift(s); }
  if(K.free){ s.free=true; s.topic=K.scene?.topic||''; s.scene='Free talk'+(s.topic?': '+s.topic:''); }
  s.sec=K.audio?.sec||s.sec||0; if(result){ s.result=result; Object.assign(s,extra); }
  LS.set(SPK.hist, h.slice(0,20)); K.histAt=at;
}

// ---- 10f. Analysis ----
const spkKeysOk = () => aiKeysOk();
function spkProvLine(){ return aiKey()?'Gemini Flash · hears grammar, pronunciation and intonation':syncOn()?'The key will come from your Apps Script.':''; }
const SPK_CHECK = `RU/UA interference codes (use these codes; add your own short code only if none fits):
ART articles: zero article for known/specific nouns, "a" with uncountables, missing "the" with superlatives/ordinals/unique (the market, the CFO, the Q3 results).
PERF Present Perfect vs Past Simple: "I work here since 2019" -> have worked; finished time (yesterday, in 2023) needs Past Simple.
PREP calqued prepositions: depend from, discuss about, according to me, in the meeting/at the meeting, on the next week, to the 15th.
SUBJ missing or dummy subject: "Is important to...", "Was decided..." -> It is / It was.
UNC uncountables as countable: informations, advices, feedbacks, equipments, a research, financings.
COMP verb patterns: suggest him to, explain me, let me to, make him to, insist to, agree this.
WO word order: adverb between verb and object (I like very much it), questions in indirect speech (Tell me what is it), fronting.
COND future in time/if clauses: "when it will close", "if we will refinance".
NEG double negation, "nobody didn't".
QUES question formation without auxiliary or with direct-question order.
MOD modality too strong for business: must/should/need as orders; missing softeners (could we, would you mind).
FF false friends: actual (=current), eventually (=possibly), realize (=implement), control (=check), sympathetic, fabric, perspective (=prospect), accurate (=neat), decade (=10 days), magazine (=shop), concurrent (=competitor).
CLICHE literal calques: "as for me", "in my opinion" overuse, "it is not a secret", "on the one hand" without the other, "the question is in".
REG register/directness: blunt imperatives, "you must", "no", too formal "hereby", missing hedges.
LEX low-value words (very good, big problem, a lot of, do/make confusion) where a precise collocation exists.
PRON (audio only) meaning-changing first: final devoicing (bag->back, need->neat), vowel length (ship/sheep, full/fool), /w/ vs /v/, th, /h/ as Russian [x], word stress in domain words (de-VE-lop-ment, e-co-NO-mics vs e-CO-no-my, PUR-chase, COM-pa-ny, a-NAL-y-sis, ca-PI-tal-ise, ma-TUR-i-ty).
Prosody: syllable-timed rhythm instead of stress-timed, no thought groups, falling tone on requests (sounds like an order), no contrastive stress, filler density (ehm, eh, like, you know, actually, so).`;

11. Language: summary, comment, why, hook, tip, explanation, next in Russian. transcript, quote, native, fix, examples, native_version in English.

${SPK_CHECK}

// ---------- 12. Context Drills (Mode 4): pushed written output with AI feedback ----------
// Method (why it is built this way):
// · Retrieval + pushed output (Swain): the learner must produce the target, not recognise it.
// · Task-based (TBLT): every item is a real work moment (email, call, board pack), not a grammar exercise.
// · Four task types, interleaved in Mix: Respond (situation → reply), Translate (RU cue → EN, the learner's real job),
//   Upgrade (fix a blunt or calqued line: register and collocation), Create (personal sentence: self-reference effect).
// · Graded hints (scaffolding): each hint lowers the SRS credit, so the learner pays for help instead of skipping effort.
// · Feedback = recast + metalinguistic hint: a minimal fix that keeps the learner's own words (noticing the gap),
//   a native executive version (the model to imitate), one memorable rule per error, codes shared with Mode 3.
// · Uptake: one rewrite per item, checked again. Error codes accumulate across sessions into a personal pattern list.
const COACH = { hist:'bet3.coach', sizes:[3,5,7] };
const C_DOMAIN = 'Corporate finance, debt capital markets (bonds, loans, liability management, rating agencies), strategy and investor relations in a Metals & Mining group (steel, iron ore, coal); board, banks, investors and auditors as counterparts';
const FMT = {
  scenario:{ l:'Respond', d:'Reply to a live work moment', ico:'↩' },
  translate:{ l:'Translate', d:'Russian cue → natural English', ico:'⇄' },
  upgrade:{ l:'Upgrade', d:'Fix a blunt or calqued line', ico:'↑' },
  create:{ l:'Create', d:'Your own sentence about your work', ico:'✎' }
};
const ICON_COACH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const coachHist = () => LS.get(COACH.hist, []);
function coachStep(t){ if(st.C){ st.C.step=t; } const el=$('#coachStep'); if(el) el.textContent=t; }

// ---- 12a. Picking targets and task types ----
function coachBuild(fmt, src, n){
  const P=(data.phr?.items||[]).filter(i=>inScope(i) && i.status!=='Alt');
  const V=(data.voc?.items||[]).filter(inScope);
  let nP = src==='phr' ? n : src==='voc' ? 0 : Math.ceil(n*0.6), nV=n-nP;
  nP=Math.min(nP,P.length); nV=Math.min(n-nP,V.length); if(nP+nV<n) nP=Math.min(P.length,n-nV);
  const prim=shuffle([...wpick(P,nP,spkWeight), ...wpick(V,nV,i=>spkWeight(i)*(rank(i)===0?1.2:1))]);
  const kinds = fmt==='mix' ? (()=>{ const base=shuffle(Object.keys(FMT)); return prim.map((_,i)=>base[i%base.length]); })() : prim.map(()=>fmt);
  const used=new Set(prim);
  return prim.map((it,i)=>{
    const t={ fmt:kinds[i], targets:[it], hints:0, tries:[] };
    // A Respond task pairs a function phrase with one content chunk: frame + content in the same reply
    if(t.fmt==='scenario' && it.deck==='phr' && src!=='phr'){ const c=wpick(V.filter(x=>!used.has(x)),1,spkWeight)[0]; if(c){ used.add(c); t.targets.push(c); } }
    return t;
  });
}
const tgtLine = it => `${it.deck}:${it.id} | ${it.en} | ${it.ru}${it.type?' | '+it.type:''}${it.register?' | register '+it.register:''}${it.note?' | '+String(it.note).slice(0,160):''}${it.examples?.[0]?' | e.g. '+it.examples[0]:''}`;

// ---- 12b. Prompts ----
// One short prompt per task type. Each type has its own JSON field named after its language (ru / en),
// and the app checks the language, so a Translate task can never arrive in English.
const CYR = /[а-яё]/i;
const tq = it => `"${it.en}" (${it.ru})`;
function coachGenPrompt(t){
  const tg=t.targets.map(tq).join(' and '), ctx=`Work context: ${cfg.aiDomain||C_DOMAIN}.`;
  const P = {
translate:`Write ONE Russian sentence (${L().tr}) that a Russian-speaking CFO or banker would naturally say at work.
The most natural English rendering of its key idea must be the target: ${tg}.
The sentence must be in Russian only, must not contain the target or a word-for-word calque of it, and must use plain everyday business Russian.
${ctx}
Return JSON: {"ru":"..."}`,
scenario:`Write a short work message to the learner in English (${L().scen}, simple B2 words).
Include a name and role, one concrete detail (number, deadline, plant), and end with a direct question.
The natural reply should use: ${tg}. Do not use the target in the message.
${ctx}
Return JSON: {"en":"...","ru":"<natural Russian translation>"}`,
upgrade:`Write ONE English sentence (${L().up}) that a non-native finance professional might say: clear but blunt, vague or calqued from Russian.
It should express the idea that ${tg} expresses better. Do not use the target.
${ctx}
Return JSON: {"en":"...","flaw_ru":"<what is wrong, in Russian, without giving the answer>"}`,
create:`Write a one-line situation cue in Russian (max 15 words) from corporate finance work that invites using ${tg}.
${ctx}
Return JSON: {"ru":"..."}`
  }[t.fmt];
  return { sys:'You write short English practice tasks for a Russian-speaking finance professional. Return ONLY JSON.', user:P };
}
// true when the generated text fits the task type: right language, target not given away
function genOk(t, g){
  const has=x=>typeof x==='string' && x.trim().length>5, leak=x=>t.targets.some(it=>norm(x).includes(norm(stripBr(it.en))));
  if(t.fmt==='translate'||t.fmt==='create') return has(g.ru) && CYR.test(g.ru) && !/[a-z]{4,}\s+[a-z]{4,}\s+[a-z]{4,}/i.test(g.ru);
  return has(g.en) && !CYR.test(g.en) && !leak(g.en);
}
function genApply(t, g){
  if(t.fmt==='translate'||t.fmt==='create'){ t.prompt=g.ru.trim(); }
  else { t.prompt=g.en.trim(); t.prompt_ru=CYR.test(g.ru||'')?g.ru:''; t.flaw_ru=g.flaw_ru||''; }
}
async function genTask(t){
  for(let k=0;k<2;k++){
    try{ const g=await aiJSON(coachGenPrompt(t), { temp:k?0.6:0.9, max:1500, label:'Tasks · ', kind:'gen' }); if(genOk(t,g)){ genApply(t,g); return true; } }
    catch(e){ if(k) throw e; }
  }
  return false;
}
function coachEvalPrompt(t, answer, retry){
  const task = t.fmt==='translate' ? `translate this Russian sentence into English: «${t.prompt}»` : t.fmt==='upgrade' ? `rewrite this line better: "${t.prompt}"` : t.fmt==='scenario' ? `reply to this message: "${t.prompt}"` : `write a sentence for this cue: «${t.prompt}»`;
  return {
sys:`You check one written answer by a ${L().id} English learner (Russian native, finance professional). Return ONLY JSON.
- grade: A (a manager would send it as is), B (correct, small non-native choices), C (understandable, errors or target misused), D (meaning lost or target missing). ${L().bar}
- task_ok: false if the answer does not do the task (for a translation: meaning missing or changed)
- comment: one short sentence in Russian, the main point${retry?'; this is a second attempt, say what improved':''}
- targets: [{"id":"...","status":"used|error|avoided"}]
- marked: the answer copied exactly, errors as [[words|E|Type|Fix|why in Russian]], strong choices as [[words|S|Type|—|why in Russian]]
- fix: the answer with only the errors corrected
- native: how a native executive would say it, max ${L().native} words, simple reusable words
- rules: max ${L().rules}, [{"code":"...","rule":"in Russian, short and memorable"}]; codes ART, PREP, PERF, COMP, FF, REG, LEX, OTHER
Flag only real errors. If the answer is good, say so.
In "marked": ${topicRule()}`,
user:`Task: ${task}
Target(s): ${t.targets.map(it=>`${it.deck}:${it.id} = "${it.en}" (${it.ru})`).join('; ')}
Hints used: ${t.hints}
Answer: "${answer}"`
  };
}

async function coachStart2(fmt, tasks){
  st.C={ phase:'gen', fmt, tasks, i:0, at:Date.now(), step:'' }; go('coach');
  try{
    const res=await Promise.allSettled(tasks.map(genTask));
    if(res.every(r=>r.status==='rejected')) throw new Error(res[0].reason?.message||'no response');
    if(res.every(r=>r.status!=='fulfilled'||!r.value)) throw new Error('the model returned no usable tasks');
    tasks.forEach((t,i)=>{ if(res[i].status!=='fulfilled'||!res[i].value){ t.fmt='create'; t.prompt=''; } });   // a failed item still trains the target
    st.C.phase='task';

actions.coachCheck = async () => {
  const C=st.C, t=C.tasks[C.i], el=$('#cAns'), ans=(el?.value||'').trim();

    const r=await aiJSON(coachEvalPrompt(t, ans, retry), { temp:0.2, max:3000, label:'Check · ', kind:'eval' });
    r.grade=String(r.grade||'C').trim().toUpperCase()[0]; if(!GR[r.grade]) r.grade='C';
    const ids=t.targets.map(i=>i.deck+':'+i.id);
    r.targets=ids.map(id=>{ const x=(r.targets||[]).find(y=>String(y.id)===id) || (r.targets||[]).find(y=>norm(String(y.id))===norm(id)) || {status:'avoided'}; return { ...x, id, status:['used','error','avoided'].includes(x.status)?x.status:'avoided' }; });
    ['alts','rules'].forEach(k=>{ if(!Array.isArray(r[k])) r[k]=[]; }); r.rules=r.rules.slice(0,L().rules);
    t.res=r; if(!retry){ t.first=r.grade; coachSRS(t); markActive(); }

};
function coachSRS(t){

    if(s==='avoided' || r.grade==='D') softLapse(x);

}

  r.onend=()=>{ if(dictRec===r) dictStop(); };

// Prices USD per 1M tokens [text in, audio in, out incl. thinking], ai.google.dev, checked Nov 2026. Unknown models count as 2.5 Flash.
const PRICE = { 'gemini-2.5-flash-lite':[0.10,0.30,0.40], 'gemini-2.5-flash':[0.30,1.00,2.50], 'gemini-3.1-flash-lite':[0.25,0.50,1.50], 'gemini-3-flash':[0.50,1.00,3.00], 'gemini-3.8-flash':[0.75,1.50,3.75] };
const priceOf = m => { const k=Object.keys(PRICE).sort((a,b)=>b.length-a.length).find(k=>m===k||m.startsWith(k+'-')&&(/lite/.test(k)||!/lite/.test(m))); return PRICE[k]||PRICE['gemini-2.5-flash']; };
// gen = writing drill tasks (easy), eval = checking an answer (needs judgement), audio = Mode 3 speech audit (needs to hear well)
const AI_PROFILES = {
  eco:{ l:'Economy', d:'Flash-Lite everywhere. About 4x cheaper; feedback is shorter and misses more subtle errors.', gen:['2.5-flash-lite','3.1-flash-lite'], eval:['2.5-flash-lite','3.1-flash-lite'], audio:['3.1-flash-lite','2.5-flash-lite'] },
  bal:{ l:'Balanced', d:'Recommended. Flash-Lite writes the tasks, 2.5 Flash checks answers and listens to speech. About $0.005 per checked answer, $0.03 per 3-minute take.', gen:['2.5-flash-lite','3.1-flash-lite'], eval:['2.5-flash','3.1-flash-lite'], audio:['2.5-flash'] },
  top:{ l:'Best', d:'The newest Flash for everything. 1.5 to 2x the Balanced cost; worth it only if Balanced feedback feels wrong.', gen:['2.5-flash-lite'], eval:['*'], audio:['*'] }
};
const aiProf = () => AI_PROFILES[cfg.aiProfile] ? cfg.aiProfile : 'bal';
// Preferred models first, then everything else the key offers (newest full Flash first) as the fallback chain.
function pickModels(list, kind){
  const prefs=AI_PROFILES[aiProf()][kind]||['*'], out=[];
  const hit=(n,p)=> n==='gemini-'+p || (n.startsWith('gemini-'+p+'-') && (/lite/.test(p)||!/lite/.test(n)));
  prefs.forEach(p=>{ const c=p==='*' ? list.filter(n=>!/lite/.test(n)) : list.filter(n=>hit(n,p)); c.sort((a,b)=>(/preview|exp/.test(a)?1:0)-(/preview|exp/.test(b)?1:0)); c.forEach(n=>{ if(!out.includes(n)) out.push(n); }); });
  list.forEach(n=>{ if(!out.includes(n)) out.push(n); });
  return out.slice(0,5);
}
function trackUsage(m, kind, u){
  if(!u) return; const pr=priceOf(m), audio=(u.promptTokensDetails||[]).filter(x=>x.modality==='AUDIO').reduce((a,x)=>a+(x.tokenCount||0),0);
  const usd=((u.promptTokenCount||0)-audio)/1e6*pr[0] + audio/1e6*pr[1] + ((u.candidatesTokenCount||0)+(u.thoughtsTokenCount||0))/1e6*pr[2];
  const mo=today().slice(0,7), U=LS.get('bet3.usage',{}); if(U.mo!==mo){ U.prev=U.mo?{mo:U.mo,usd:U.usd}:U.prev; U.mo=mo; U.usd=0; U.n={}; U.c={}; }
  U.usd+=usd; U.n[kind]=(U.n[kind]||0)+1; U.c[kind]=(U.c[kind]||0)+usd; LS.set('bet3.usage',U);
}

// ---------- 15. Error journal: every mistake from Speak (Mode 3) and Drills (Mode 4) goes to the "Errors" tab ----------
// One row per mistake, deduplicated by key. Rows wait in a local queue while offline and are sent with the next call.
const ERR = { all:'bet3.errs', q:'bet3.errq', up:'bet3.errup', lessons:'bet3.lessons', back:'bet3.errBackfill', hist:'bet3.fixhist' };
const TYPE_CODE = [[/article/i,'ART'],[/prepos/i,'PREP'],[/tense|aspect|perfect/i,'PERF'],[/verb pattern|complement|gerund|infinitive/i,'COMP'],
  [/word order/i,'WO'],[/register|tone|polite/i,'REG'],[/false friend/i,'FF'],[/lexis|lexical|collocation|idiom|meaning|word choice|vocab/i,'LEX'],
  [/spell/i,'OTHER'],[/grammar|agreement|plural|countable|conditional|question|negat|modal|subject/i,'GRAM']];
// Topic ids ("ART.a-an-adj") live in the type column. The coaches tag errors with them; the code is the prefix.
const isTopic = s => /^[A-Z]+\.[a-z0-9-]+$/.test(String(s||'').trim());
const typeLabel = s => (isTopic(s) && BANK?.[String(s).trim()]?.lesson?.title_ru) || s || '';
const topicList = () => Object.entries(BANK||{}).map(([id,b])=>`${id}: ${b.lesson?.hint_en||b.lesson?.title_en||''}`).join('\n');
const topicRule = () => BANK && Object.keys(BANK).length
  ? `Type for an error (E) = the id of the topic below whose rule was broken. If none fits, use <CODE>.other with the closest code (ART, PREP, NEG, GRAM, COND, PERF, QUES, UNC, COMP, WO, FF, LEX, REG). For a success (S) use one of Grammar, Lexis, Idiom, Register, Discourse.\nTopics:\n${topicList()}`
  : 'Type one of Grammar, Lexis, Preposition, Article, Tense, Register, Word order, False friend, Idiom, Discourse.';
const typeCode = t => isTopic(t) ? String(t).trim().split('.')[0] : (TYPE_CODE.find(([re])=>re.test(t||''))||[0,'OTHER'])[1];
const stripMarks = s => String(s||'').replace(/\[\[(.+?)\]\]/g,(m,x)=>x.split('|')[0]);
const errAll = () => LS.get(ERR.all, []);
function errRows(text, base){ // type = topic id when the coach used one
  return parseMarks(text||'').toks.filter(t=>t.k==='E' && t.text && t.fix && t.fix.trim()!=='—' && norm(t.text)!==norm(t.fix))
    .map(t=>({ ...base, type:(t.type||'').trim(), code:typeCode(t.type), wrong:t.text.trim(), fix:t.fix.trim(), why_ru:(t.why||'').trim() }));
}
function errLog(rows){
  if(!rows.length) return;
  const all=errAll(), have=new Set(all.map(r=>r.key)), fresh=rows.filter(r=>!have.has(r.key)).map(r=>({ ...r, status:'open' }));
  if(!fresh.length) return;
  LS.set(ERR.all, [...all, ...fresh].slice(-3000)); LS.set(ERR.q, [...LS.get(ERR.q,[]), ...fresh]); errFlush();
}
let errBusy=false;
async function errFlush(){
  if(errBusy || !syncOn()) return;
  const q=LS.get(ERR.q,[]).slice(0,300), up=LS.get(ERR.up,[]).slice(0,300); if(!q.length && !up.length) return;
  errBusy=true; let sent=false; const stat=m=>LS.set('bet3.errstat',{ at:Date.now(), ok:sent, msg:m });
  try{ const r=await syncPost({ action:'errors', rows:q, updates:up });
    if(r.ok && r.added!==undefined){ sent=true; LS.set(ERR.q, LS.get(ERR.q,[]).slice(q.length)); LS.set(ERR.up, LS.get(ERR.up,[]).slice(up.length)); stat(`Sent ${q.length} errors, ${r.added} new in the sheet`); }
    else stat('The Apps Script answered, but it is the old version without the Errors tab. Paste the new Code.gs and deploy a New version.'); }
  catch(e){ stat('Could not send: '+e.message); }
  errBusy=false;
  if(sent && (LS.get(ERR.q,[]).length || LS.get(ERR.up,[]).length)) return errFlush();   // more arrived while sending
}
async function errPull(){
  if(!syncOn()) return false;
  await errFlush();
  try{ const r=await syncPost({ action:'errorsGet' }); if(!r.ok || !Array.isArray(r.rows)) return false;
    const local=Object.fromEntries(errAll().map(x=>[x.key,x])), pend=new Set(LS.get(ERR.up,[]).map(u=>u.key));
    r.rows.forEach(x=>{ if(!x.key) return; local[x.key] = pend.has(x.key) && local[x.key] ? local[x.key] : { ...local[x.key], ...x }; });
    LS.set(ERR.all, Object.values(local).sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(-3000)); return true; }
  catch(e){ return false; }
}
function errSetStatus(keys, status){

  LS.set(ERR.all, errAll().map(r=>set.has(r.key)?{ ...r, status, updated:today() }:r));
  LS.set(ERR.up, [...LS.get(ERR.up,[]).filter(u=>!set.has(u.key)), ...keys.map(key=>({ key, status }))]); errFlush();
}

// ---------- 16. Fix My Errors (Mode 5): a short lesson built from your own mistakes, then 8 tasks on that one rule ----------
// Method: explicit rule first (noticing), then a graded sequence: recognise (choose) > controlled (gap) > repair (fix) > produce (translate).
// 7 of 8 right marks the errors behind the lesson as drilled; another 7+ on a later day marks them fixed.
const FIX_MIN = 3;
const ICON_FIX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>';
const FTYPE = { choose:'Choose', gap:'Fill the gap', fix:'Fix the mistake', translate:'Translate' };
// Groups: every error carries a topic id in its type column ("ART.a-an-adj"); the bank (fixbank.json in the repo + FixBank tab) holds
// one lesson and a task set per topic. Errors with no known topic (rare: new ones the coach could not place) fall back to one group per code.
function fixGroups(){
  const live=errAll().filter(r=>r.status!=='fixed'), now=Date.now(), by={}, rest={};
  const rec=d=>{ const a=(now-new Date(d||0).getTime())/DAY; return a<=14?1:a<=60?.7:.5; };
  const mk=(id,code,title,rows,bank)=>{ const drilled=rows.filter(r=>r.status==='drilled').length, last=rows.reduce((m,r)=>String(r.date)>m?String(r.date):m,'');
    return { id, code, title, bank, rows:rows.slice().reverse(), n:rows.length, drilled, last, min:bank?1:FIX_MIN,
      score:rows.reduce((t,r)=>t+(r.status==='drilled'?.3:1)*rec(r.date),0) }; };
  live.forEach(r=>{ const t=String(r.type||'').trim(); if(isTopic(t) && BANK?.[t]) (by[t]=by[t]||[]).push(r); else { const c=r.code||'OTHER'; (rest[c]=rest[c]||[]).push(r); } });
  const out=Object.entries(by).map(([id,rows])=>mk(id, id.split('.')[0], BANK[id].lesson.title_ru||id, rows, true)), topics=out.length>0;
  Object.entries(rest).forEach(([c,rows])=>out.push(mk(c, c, (CODE_RU[c]||c)+(topics?' · not in a lesson yet':''), rows, false)));
  out.forEach(x=>x.ready=x.n>=x.min);
  return out.sort((a,b)=>(b.ready-a.ready)||(b.score-a.score));
}
// Mixed review: interleaved tasks from several topics you already drilled on an earlier day. Retrieval without knowing the rule in advance is the real test.
function mixTopics(){
  const t=today();
  return fixGroups().filter(g=>g.bank && g.rows.some(r=>r.status==='drilled' && String(r.updated||r.date)<t))
    .map(g=>({ ...g, since:g.rows.filter(r=>r.status==='drilled').reduce((m,r)=>String(r.updated||r.date)<m?String(r.updated||r.date):m,'9999') }))
    .sort((a,b)=>a.since.localeCompare(b.since));
}

// ---- 16d. FixBank: lessons and task banks prepared every 3 days by a scheduled Claude run (tab "FixBank": code | updated | basis | lesson | tasks).
// The app prefers the bank (deeper analysis of all errors, instant start); Gemini is the fallback when a pattern has no bank yet.
let BANK=null;
async function bankLoad(force){
  // Base bank: fixbank.json shipped with the app. Layer: FixBank tab, written by the scheduled run (new topics, new or corrected
  // tasks by id, a newer lesson). Rows whose code has no "." are from the old one-row-per-code bank and are ignored.
  if(BANK && !force) return BANK;
  const c=LS.get('bet3.bank3',null);
  if(c && !force && Date.now()-c.at<6*3600e3) return (BANK=c.v);
  const v={}; let got=false;
  try{ const r=await fetch('fixbank.json',{cache:'no-store'}); if(r.ok){ Object.assign(v, await r.json()); got=true; } }catch(e){}
  try{ const id=sheetId(cfg.sheet)||sheetId(LIB_URL), r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=FixBank`,{cache:'no-store'});
    const t=await r.text(); if(!r.ok || /^\s*<(!doctype|html)/i.test(t)) throw 0;
    const rows=splitTSV(t), h=(rows[0]||[]).map(x=>x.trim().toLowerCase()), col=n=>h.indexOf(n);
    if(col('code')>=0){ got=true; rows.slice(1).forEach(r=>{ try{ const code=(r[col('code')]||'').trim(); if(!isTopic(code)) return;
      const lesson=r[col('lesson')]?JSON.parse(r[col('lesson')]):{}, tasks=r[col('tasks')]?JSON.parse(r[col('tasks')]):[];
      const base=v[code]||{ updated:'', lesson:{}, tasks:[] }, m=new Map(base.tasks.map(x=>[x.id,x]));
      (Array.isArray(tasks)?tasks:[]).forEach(x=>{ if(x&&x.id&&x.type) m.set(x.id,x); });
      const ls=lesson?.title_ru ? { ...base.lesson, ...lesson, hint_en:lesson.hint_en||base.lesson.hint_en } : base.lesson, up=String(r[col('updated')]||'');
      if(ls?.title_ru && m.size) v[code]={ updated:up>base.updated?up:base.updated, lesson:ls, tasks:[...m.values()] }; }catch(e){} }); } }
  catch(e){}
  if(!got) return (BANK=c?.v||{});
  LS.set('bet3.bank3',{ at:Date.now(), v }); return (BANK=v);
}
const bankTask = t => ({ ...t, type:String(t.type).toLowerCase(), answers:(t.answers||[]).map(String), options:(t.options||[]).map(String), answer:+t.answer||0, res:null, pick:undefined, ans:undefined });
function bankPick(code, want){
  const b=BANK?.[code]; if(!b) return null;
  const all=b.tasks.map((t,i)=>({ ...t, id:t.id||code+'-'+i })), seen=LS.get('bet3.fixseen',{}), mine=new Set(seen[code]||[]);
  let pool=all.filter(t=>!mine.has(t.id)); if(pool.length<8){ mine.clear(); pool=all; }
  const by=k=>shuffle(pool.filter(t=>t.type===k)), pick=[];
  const plan=want||{choose:2,gap:2,fix:2,translate:2}, total=Object.values(plan).reduce((a,b)=>a+b,0);
  Object.entries(plan).forEach(([k,m])=>pick.push(...by(k).slice(0,m)));
  if(pick.length<total) pick.push(...shuffle(pool.filter(t=>!pick.includes(t))).slice(0,total-pick.length));
  pick.forEach(t=>mine.add(t.id)); seen[code]=[...mine]; LS.set('bet3.fixseen',seen);
  const order={choose:0,gap:1,fix:2,translate:3}; return pick.sort((a,b)=>order[a.type]-order[b.type]);

  Object.assign(F,{ phase:'sum', n, ok, need:Math.ceil(n*.8), promoted:{ drilled:0, fixed:0, back:0 } });
  const hist=e=>{ const h=LS.get(ERR.hist,[]); h.unshift(e); LS.set(ERR.hist, h.slice(0,30)); };
  if(F.mix){ F.mixRes=[];
    [...new Set(base.map(t=>t.topic))].forEach(id=>{ const ls=BANK?.[id]?.lesson||{}, pass=base.filter(t=>t.topic===id).every(t=>t.res?.ok);
      const dr=live.filter(r=>String(r.type).trim()===id && r.status==='drilled').map(r=>r.key), c=fixCard(id), stage=c?c.stage:0, m={ id, title:ls.title_ru||id, ok:pass, fixed:0, back:0, next:0 };

    hist({ at:F.at, code:'MIX', title:'Review', score:ok, of:n }); dayLog('fix'); markActive(); return go('fix'); }

function rpRead(){ const R=st.R, lines=R.rp.lines, last=Math.min(R.i,lines.length-1); let out='';
  for(let i=0;i<=last;i++){ const f=lines[i].fork;
    if(f && !R.branch){ out+=`<div class="rp-fork"><div class="eyebrow">Your move</div>${['agree','push'].map(b=>`<button class="btn ghost" data-act="rpFork" data-v="${b}"><span style="text-align:left">${b==='agree'?'Agree':'Push back'}<small class="muted" style="display:block;font-weight:500">${esc(f[b].label)}</small></span></button>`).join('')}</div>`; break; }
    out+=rpBubble(R,i,{ru:true}); }
  const waiting=lines[last].fork&&!R.branch, end=R.i>=lines.length-1;
  return `<div class="stack">${rpHead(R)}<div class="t-chat">${out}</div>
    ${waiting?'':end?`<button class="btn spk-go" data-act="rpPass" data-v="fill">Next: fill the gaps</button>`:`<button class="btn" data-act="rpNext">Next line</button>`}</div>`; }
function rpGapLine(R,i){ const L=rpLine(R,i); let g=0;
  return L.t.map((s,j)=> typeof s==='string' ? esc(s) : `<input class="rp-gap ${R.chk?(R.gres[g]?'ok':'bad'):''}" data-g="${g++}" size="${Math.max(5,Math.min(30,Math.round(s.t.length*0.8)))}" autocomplete="off" autocapitalize="off" spellcheck="false" ${R.chk?'disabled':''} value="${esc(R.gv?.[g-1]||'')}" aria-label="phrase ${g}">`).join(''); }
function rpFill(){ const R=st.R, i=R.i, lines=R.rp.lines; let out='';
  for(let k=0;k<i;k++) out+=rpBubble(R,k,{ru:true});
  out+=rpBubble(R,i,{gap:rpGapLine(R,i)});
  const hint=R.chk?'':`<div class="muted" style="font-size:.88rem">Type each underlined phrase. Any synonym from the list is accepted.</div>`;
  const fb=R.chk?`<div class="note ${R.gres.every(Boolean)?'':'warn-note'}"><b>${R.gres.every(Boolean)?'Right':'Check the model'}</b><div class="serif">${rpHtml(R,i)}</div><div class="muted" style="font-size:.88rem">${esc(rpLine(R,i).ru||'')}</div></div>`:'';
  return `<div class="stack">${rpHead(R)}<div class="t-chat">${out}</div>${hint}${fb}
    <div class="actions">${R.chk?`<button class="btn" data-act="rpFillNext">${rpYs(R).indexOf(i)===rpYs(R).length-1?'Next: recall':'Continue'}</button>`
      :`<button class="btn ghost" data-act="rpShow" style="flex:0 0 auto">Show</button><button class="btn" data-act="rpCheck">Check</button>`}</div></div>`; }
function rpRecall(){ const R=st.R, i=R.i, lines=R.rp.lines; let out='';
  for(let k=Math.max(0,i-2);k<i;k++){ if(lines[k].w==='B'||k===i-1) out+=rpBubble(R,k,{ru:true}); }
  const L=rpLine(R,i);
  const res=R.res?`<div class="note ${R.res.hits===R.res.tot?'':'warn-note'}"><b>${R.res.hits}/${R.res.tot} phrases${R.res.tot?'':' (none in this line)'} · ${R.res.score}% of the words</b>
      <div class="serif" style="margin:4px 0">${rpHtml(R,i)}</div><div class="muted" style="font-size:.88rem">${esc(L.ru||'')}</div>${audioBtn(rpPlain(R,i))}
      ${R.res.list.map(x=>`<div class="spk-t ${x.ok?'ok':'bad'}"><div class="spk-ti">${x.ok?'✓':'×'}</div><div class="meta"><span class="serif">${esc(x.s)}</span></div></div>`).join('')}</div>`:'';
  return `<div class="stack">${rpHead(R)}<div class="t-chat">${out}${R.pop&&R.pop.i===i?rpPopHtml(R,i):''}</div>
    <div class="muted" style="font-size:.9rem">Your line, from memory. Aim to use the phrases you studied.</div>
    ${R.res?'':`<div class="c-in"><textarea id="rAns" rows="3" spellcheck="false" autocomplete="off" placeholder="${SR?'Tap the mic and say it, or type':'Type your line'}">${esc(R.draft||'')}</textarea>${SR?`<button class="c-mic ${R.dict?'on':''}" data-act="rpDict" aria-label="Dictate">${ICON.mic||'●'}</button>`:''}</div>`}
    ${res}
    <div class="actions">${R.res?`<button class="btn" data-act="rpRecNext">${rpYs(R).indexOf(i)===rpYs(R).length-1?'Finish':'Continue'}</button>`
      :`<button class="btn ghost" data-act="rpGiveUp" style="flex:0 0 auto">Show line</button><button class="btn" data-act="rpRecCheck">Check</button>`}</div></div>`; }
function rpEnd(){ const R=st.R, T=R.T, d=rpProg().done[R.rp.id]||{}, nx=T.rps[R.rp.n], other=R.branch==='agree'?'push':'agree';
  return `<div class="stack spk-res"><div class="summary-hero spk-sum"><div class="eyebrow">Role play · ${esc(R.rp.t)}</div><div class="n">${R.acc}<small>% of phrases recalled</small></div>
      <div class="muted">${R.hits} of ${R.tot} · route: ${R.branch==='agree'?'agree':'push back'}</div></div>
    <section><h3 class="spk-h">Phrases in this dialogue</h3>${R.ph.map(x=>`<div class="spk-t ${x.ok?'ok':'bad'}"><div class="spk-ti">${x.ok?'✓':'×'}</div><div class="meta"><span class="serif">${esc(x.s)}</span><div class="muted" style="font-size:.85rem">${esc(x.ru||'')}</div></div></div>`).join('')}</section>
    <div class="actions">${nx?`<button class="btn" data-act="rpStart" data-id="${nx.id}" ${nx.ready?'':'disabled'}>+ ${nx.ready?'Next role play':'Next one soon'}</button>`:''}<button class="btn ghost" data-act="rpOther" data-v="${other}">${other==='agree'?'Try: agree':'Try: push back'}</button></div>
    <button class="btn ghost" data-act="rpTopic" data-id="${T.id}" style="width:100%">Back to the topic</button></div>`; }
function talkAfter(){ const R=st.R; if(!R) return; bar(R.phase==='read'?R.i/Math.max(1,R.rp.lines.length-1)*33:R.phase==='fill'?33+rpYs(R).indexOf(R.i)/rpYs(R).length*33:R.phase==='recall'?66+rpYs(R).indexOf(R.i)/rpYs(R).length*34:R.phase==='end'?100:0);
  document.querySelectorAll('.rp-gap').forEach(el=>{ el.oninput=()=>{ (R.gv=R.gv||[])[+el.dataset.g]=el.value; }; el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const n=document.querySelector(`.rp-gap[data-g="${+el.dataset.g+1}"]`); if(n) n.focus(); else actions.rpCheck(); } }; });
  const a=$('#rAns'); if(a){ a.oninput=()=>{ R.draft=a.value; }; a.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); actions.rpRecCheck(); } }; }
  if(R.phase==='fill'&&!R.chk) document.querySelector('.rp-gap')?.focus();
  document.querySelector('.t-chat')?.lastElementChild?.scrollIntoView({ block:'nearest' }); }
let rpRec=null;
function rpDictStop(){ try{ rpRec?.stop(); }catch(e){} rpRec=null; if(st.R) st.R.dict=false; document.querySelectorAll('.c-mic').forEach(b=>b.classList.remove('on')); }
function talkBack(){ const R=st.R||{}; rpDictStop(); speechSynthesis?.cancel();
  if(['read','fill','recall','end'].includes(R.phase)){ st.R={ phase:'topic', topic:R.T.id }; return go('talk'); }
  if(R.phase==='topic'){ st.R={ phase:'home' }; return go('talk'); } go('home'); }
actions.openTalk = () => { if(!st.R||st.R.phase!=='home') st.R={ phase:'home' }; go('talk'); };
actions.rpTopic = d => { st.R={ phase:'topic', topic:d.id }; go('talk'); };
actions.rpStart = d => { const f=rpFind(d.id); if(!f||!f.rp.ready) return;
  st.R={ phase:'read', T:f.T, rp:f.rp, i:0, branch:null, maxPass:1, ru:LS.get('bet3.rpru',true), pop:null, bank:undefined, pick:rpPick(f.rp), gv:[], hits:0, tot:0, ph:[] }; go('talk'); if(cfg.autoSpeak) speak(rpPlain(st.R,0)); };
actions.rpOther = d => { const R=st.R; st.R={ ...R, pick:rpPick(R.rp), phase:'read', i:0, branch:d.v, maxPass:1, pop:null, gv:[], hits:0, tot:0, ph:[], chk:false, res:null }; go('talk'); };
actions.rpRu = () => { st.R.ru=!st.R.ru; LS.set('bet3.rpru',st.R.ru); render(); };
actions.rpPop = d => { const R=st.R, i=+d.k.split('.')[1]; R.pop = R.pop&&R.pop.k===d.k&&R.pop.j===+d.j ? null : { k:d.k, j:+d.j, i }; render(); };
actions.rpAlt = d => { const R=st.R, [, i, b]=d.k.split('.'), L=R.rp.lines[+i], X=L.fork?L.fork[b]:L, seg=X.t[+d.j], v=rpVs(seg)[+d.n].t, P=rpProg(); P.alt[d.k+'.'+d.j]=v; LS.set(RPK,P); render(); };
actions.rpShuffle = () => { const R=st.R, P=rpProg(); Object.keys(P.alt).filter(x=>x.startsWith(R.rp.id+'.')).forEach(x=>delete P.alt[x]); LS.set(RPK,P); R.pick=rpPick(R.rp); render(); };
actions.rpBank = () => { st.R.bank=!rpBankOpen(st.R); render(); };
actions.rpFork = d => { const R=st.R; R.branch=d.v; R.pop=null; render(); if(cfg.autoSpeak) speak(rpPlain(R,R.i)); };
actions.rpNext = () => { const R=st.R; R.pop=null; R.i=Math.min(R.i+1,R.rp.lines.length-1); render(); if(cfg.autoSpeak&&R.rp.lines[R.i].w==='B') speak(rpPlain(R,R.i)); };
actions.rpPass = d => { const R=st.R; rpDictStop(); R.pop=null; R.bank=false; R.phase=d.v; R.chk=false; R.res=null; R.gv=[]; R.draft='';
  if(d.v==='read'){ R.i=R.branch?R.rp.lines.length-1:0; } else { R.i=rpYs(R)[0]; R.maxPass=Math.max(R.maxPass,d.v==='fill'?2:3); }
  if(d.v==='fill') R.maxPass=Math.max(R.maxPass,2); render(); };
actions.rpCheck = () => { const R=st.R, L=rpLine(R,R.i), segs=L.t.filter(s=>typeof s!=='string'), vals=[...document.querySelectorAll('.rp-gap')].map(e=>e.value);
  if(vals.some((v,n)=>!v.trim()&&false)) return; R.gv=vals; R.gres=segs.map((s,n)=>rpVariants(s).includes(norm(vals[n]||''))); R.chk=true;
  buzz(R.gres.every(Boolean)?15:[30,40,30]); render(); };
actions.rpShow = () => { const R=st.R, L=rpLine(R,R.i), segs=L.t.filter(s=>typeof s!=='string'); R.gv=segs.map(()=>''); R.gres=segs.map(()=>false); R.chk=true; render(); };
actions.rpFillNext = () => { const R=st.R, ys=rpYs(R), n=ys.indexOf(R.i); R.chk=false; R.gv=[]; if(n>=ys.length-1){ return actions.rpPass({v:'recall'}); } R.i=ys[n+1]; render(); };
actions.rpDict = () => { if(rpRec) return rpDictStop(); const ta=$('#rAns'); if(!ta||!SR) return; speechSynthesis?.cancel();
  const r=new SR(); r.lang=cfg.ygAccent==='uk'?'en-GB':'en-US'; r.interimResults=true; r.continuous=true; const base=ta.value.trim(); let fin='';
  r.onresult=e=>{ let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ const x=e.results[i]; if(x.isFinal) fin+=x[0].transcript+' '; else tmp+=x[0].transcript; }
    const el=$('#rAns'); if(el){ el.value=(base?base+' ':'')+(fin+tmp).replace(/\s+/g,' ').trim(); st.R.draft=el.value; } };
  r.onerror=e=>{ if(e.error==='not-allowed') toast('Microphone access was blocked.'); rpDictStop(); };
  r.onend=()=>{ if(rpRec===r) rpDictStop(); };
  try{ r.start(); rpRec=r; st.R.dict=true; document.querySelectorAll('.c-mic').forEach(b=>b.classList.add('on')); buzz(20); }catch(e){ toast('Dictation is not available here.'); } };
function rpScore(R, answer, i){ const L=rpLine(R,i), segs=L.t.filter(s=>typeof s!=='string'), a=' '+norm(answer)+' ';
  const list=segs.map(s=>({ s:rpSegs(R,i).find(x=>x.seg===s).s, ru:rpItem(s.id)?.ru||'', ok:rpVariants(s).some(v=>a.includes(' '+v+' ')) }));
  return { list, hits:list.filter(x=>x.ok).length, tot:list.length, score:sayScore(rpPlain(R,i), answer||'') }; }
actions.rpRecCheck = () => { const R=st.R, ans=($('#rAns')?.value||R.draft||'').trim(); if(!ans) return toast('Say or type your line first.'); rpDictStop(); R.res=rpScore(R,ans,R.i); rpTally(R); render(); };
actions.rpGiveUp = () => { const R=st.R; rpDictStop(); R.res=rpScore(R,'',R.i); rpTally(R); render(); };
function rpTally(R){ R.hits+=R.res.hits; R.tot+=R.res.tot; R.res.list.forEach(x=>{ const o=R.ph.find(y=>y.s===x.s); if(o) o.ok=o.ok&&x.ok; else R.ph.push({ s:x.s, ru:x.ru, ok:x.ok }); }); }
actions.rpRecNext = () => { const R=st.R, ys=rpYs(R), n=ys.indexOf(R.i); R.res=null; R.draft=''; R.pop=null;
  if(n>=ys.length-1){ R.acc=R.tot?Math.round(R.hits/R.tot*100):100; const P=rpProg(), old=P.done[R.rp.id];
    P.done[R.rp.id]={ at:Date.now(), acc:Math.max(R.acc,old?.acc||0), branches:[...new Set([...(old?.branches||[]),R.branch])] }; LS.set(RPK,P); dayLog('out'); markActive(); queueSync();
    R.phase='end'; return render(); }
  R.i=ys[n+1]; render(); };

// ---- 18e. FSRS-4.5 (optional). Classic = your first-answer intervals + SM-2 growth. FSRS = intervals from a memory model
// (stability, difficulty) so that the chance of recall at review time equals the target. Cards keep ivl/ease too, so switching back is safe.
const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755], F_DECAY=-0.5, F_FACTOR=19/81;
const fsrsOn = () => cfg.sched==='fsrs';
const fsrsTarget = () => { const r=Number(cfg.fsrsR); return r>=0.75&&r<=0.95?r:0.9; };
const fClamp = (x,a,b) => Math.min(b,Math.max(a,x));
const fR = (t,S) => Math.pow(1+F_FACTOR*t/S, F_DECAY);
const fIvl = S => fClamp(Math.round(S/F_FACTOR*(Math.pow(fsrsTarget(),1/F_DECAY)-1)),1,MAX_IVL);
const fD0 = G => fClamp(FW[4]-(G-3)*FW[5],1,10);
function fsrsNext(c, g){
  const G={again:1,hard:2,good:3,easy:4}[g]; let S=c.s, D=c.d;
  if(!c.reps && !S) return { s:FW[G-1], d:fD0(G) };                                    // first answer
  if(!S){ S=Math.max(1,c.ivl||1); D=fClamp(10-((c.ease||2.5)-1.3)/1.7*7,1,10); }         // a card that came from the classic scheduler
  const t=Math.max(0,(Date.now()-(c.last||Date.now()))/DAY), R=fR(t,S);
  const d=fClamp(FW[7]*fD0(3)+(1-FW[7])*(D-FW[6]*(G-3)),1,10);
  const s = G===1 ? Math.min(S, FW[11]*Math.pow(D,-FW[12])*(Math.pow(S+1,FW[13])-1)*Math.exp(FW[14]*(1-R)))
    : S*(1+Math.exp(FW[8])*(11-D)*Math.pow(S,-FW[9])*(Math.exp(FW[10]*(1-R))-1)*(G===2?FW[15]:1)*(G===4?FW[16]:1));
  return { s:Math.max(0.1,s), d };
}
{ const _g=grade; grade=function(it, g){ if(!fsrsOn()) return _g(it, g);
    const k=keyOf(it), c=srs[k] || { ivl:0, ease:2.5, reps:0, lapses:0, src:st.S?.kind==='flash'?'cards':'lesson' }, n=fsrsNext(c,g), ni=g==='again'?1:fIvl(n.s);
    if(g==='again') c.lapses=(c.lapses||0)+(c.reps?1:0);
    c.s=+n.s.toFixed(3); c.d=+n.d.toFixed(3); c.ivl=g==='again'?0:ni; c.ease=fClamp(3-(c.d-1)/9*1.7,1.3,3);
    const fuzz = ni>3 ? Math.round(ni*0.05*(Math.random()*2-1)) : 0;
    c.due=startOfDay(Date.now()+(ni+fuzz)*DAY); c.reps=(c.reps||0)+1; c.last=Date.now(); c.u=c.last; srs[k]=c; LS.set(K.srs, srs);
    bump(g!=='again'); queueSync(); }; }
{ const _p=preview; preview=function(it, g){ if(!fsrsOn()) return _p(it, g); const c=card(it)||{ ivl:0, ease:2.5, reps:0 }; return fmtIvl(g==='again'?1:fIvl(fsrsNext(c,g).s)); }; }
SYNC_CFG_KEYS.push('sched','fsrsR');

// ---- 18f. Wiring: home tiles, Today step 3 rotates speak / write / roleplay, settings
{ const _home=vHome; vHome=function(){ const h=talkHist()[0];
    const tile=`<button class="deck" data-act="openTalk"><div class="ico" style="background:var(--navy-soft);color:var(--navy)">${ICON.chat}</div>
      <div class="meta"><h3>Roleplay</h3><div class="muted" style="font-size:.85rem">Mode 6 · ready dialogues with your phrases</div>
      <div class="row" style="margin-top:8px;gap:6px"><span class="pill">${rpTopics().length||12} topics</span>${rpDoneCount()?`<span class="pill ok">${rpDoneCount()} done</span>`:''}</div></div></button>
      <button class="deck" data-act="openStats" style="padding:14px 18px"><div class="meta"><h3>Progress</h3><small class="muted">Error rate in speech, rule families, cards, activity</small></div></button>`;
    return _home().replace('<p class="hint">', tile+'<p class="hint">'); }; }
{ const _tp=todayPlan; todayPlan=function(){ const k=Math.floor(Date.now()/DAY)%3; let h=_tp();
    if(k===2) h=h.replace(/data-act="open(Speak|Coach)"([^>]*)>(<span class="t-n">[^<]*<\/span><span class="t-m">)<b>[^<]*<\/b><small>[^<]*<\/small>/, 'data-act="openTalk"$2>$3<b>Roleplay</b><small>One ready dialogue: read, fill, recall</small>');
    return h; }; }
{ const _set=vSettings; vSettings=function(){ const on=fsrsOn(), r=fsrsTarget();
    const card=`<div class="card stack"><h3>Scheduler</h3>
      <div class="seg"><button class="${on?'':'on'}" data-act="set" data-k="sched" data-v="classic">Classic</button><button class="${on?'on':''}" data-act="set" data-k="sched" data-v="fsrs">FSRS</button></div>
      ${on?`<div><div class="eyebrow" style="margin-bottom:6px">Target recall at review time</div><div class="seg">${[0.85,0.9,0.93].map(v=>`<button class="${r===v?'on':''}" data-act="fsrsR" data-v="${v}">${Math.round(v*100)}%</button>`).join('')}</div></div>
        <p class="hint" style="margin:0">FSRS sets each interval from a memory model, so that you still remember the card with the chosen probability when it comes back. New cards return sooner than with Classic (Good: about ${fIvl(FW[2])} days instead of ${ivl0('good')}), mature cards wait longer. A higher target means more reviews.</p>`
       :`<p class="hint" style="margin:0">Classic uses your first-answer intervals (${ivl0('again')} / ${ivl0('hard')} / ${ivl0('good')} / ${ivl0('easy')} days) and grows them by a fixed factor. FSRS replaces both with a memory model. You can switch back at any time; cards keep both sets of numbers.</p>`}</div>`;
    return _set().replace('<div class="card stack"><h3>Version', card+'<div class="card stack"><h3>Version'); }; }
actions.fsrsR = d => { cfg.fsrsR=+d.v; touchCfg(); render(); };
rpLoad();
bankLoad().then(()=>{ if(st.view==='home') render(); });   // rule titles on the Today plan need the bank
errBackfill();
render();
