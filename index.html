<style>
/* Concept: an Economist-style reading page (shared with Summarizer 3.0): white paper, ink, one red.
   Red marks the brand rule, primary action and errors; navy marks 'good' and links.
   Previous concept: a reading desk. The phrase is set in a book serif and owns the screen;
   UI chrome is quiet, violet-tinted neutrals. One signature motion: the card flip and its exit.
   Radii by role: hero 24 / card 18 / control 12 / pill full. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2EE; --line:#D9D9D4;
  --fg:#0D0D0D; --muted:#595959;
  --primary:#E3120B; --primary-ink:#FFFFFF; --primary-soft:#FBE9E7; --primary-deep:#F2F2EE;
  --navy:#1F2E7A; --navy-soft:#E6E9F4;
  --dark:#0D0D0D; --dark-ink:#FFFFFF; --yellow:#E3120B;
  --mint:#E3EFEA; --blue:#E6E9F4; --purple:#EBE7F2; --peach:#F7EBDD; --rose:#FBE9E7; --sand:#F4EEDC;
  --ok:#1E7A55; --ok-soft:#E3F1EA; --bad:#E3120B; --bad-soft:#FBE9E7; --warn:#8A5A00; --warn-soft:#F6EDD6;
  --shadow:0 1px 0 rgba(13,13,13,.04),0 10px 24px -16px rgba(13,13,13,.25);
  --r-sm:999px; --r-md:6px; --r-lg:6px; --r-xl:6px;
  --font:'Libre Franklin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1C1C1C; --surface-2:#232323; --line:#333333;
  --fg:#ECECEC; --muted:#A6A6A6;
  --primary:#FF4B42; --primary-ink:#121212; --primary-soft:#3A1A18; --primary-deep:#1C1C1C;
  --navy:#9FB0FF; --navy-soft:#1E2340;
  --dark:#ECECEC; --dark-ink:#121212; --yellow:#FF4B42;
  --mint:#18291F; --blue:#1E2340; --purple:#24202E; --peach:#2E2418; --rose:#3A1A18; --sand:#2C2717;
  --ok:#4FC98E; --ok-soft:#16291F; --bad:#FF4B42; --bad-soft:#3A1A18; --warn:#E8B34A; --warn-soft:#30280F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --surface-2:#232323; --line:#333333;
  --fg:#ECECEC; --muted:#A6A6A6;
  --primary:#FF4B42; --primary-ink:#121212; --primary-soft:#3A1A18; --primary-deep:#1C1C1C;
  --navy:#9FB0FF; --navy-soft:#1E2340;
  --dark:#ECECEC; --dark-ink:#121212; --yellow:#FF4B42;
  --mint:#18291F; --blue:#1E2340; --purple:#24202E; --peach:#2E2418; --rose:#3A1A18; --sand:#2C2717;
  --ok:#4FC98E; --ok-soft:#16291F; --bad:#FF4B42; --bad-soft:#3A1A18; --warn:#E8B34A; --warn-soft:#30280F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 56px}
#app.enter{animation:enter .22s var(--ease)}
@keyframes enter{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.topbar-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:1.02rem;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:3px;background:transparent}
.progress>i{display:block;height:100%;width:0;background:var(--primary);border-radius:0 3px 3px 0;transition:width .45s var(--ease)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

h2{font-size:1.6rem;font-weight:650;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.015em}
h3{font-size:1.02rem;font-weight:600;margin:0}
.eyebrow{font-size:.82rem;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.tile{border:1px solid var(--line);background:var(--surface);text-align:left;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:flex-end;position:relative;transition:transform .15s var(--ease),border-color .15s}
.tile::before{content:"";position:absolute;top:16px;left:16px;width:28px;height:28px;border-radius:9px;background:var(--tint,var(--surface-2))}
.tile:active{transform:scale(.97)}
.tile small{color:var(--muted);font-size:.82rem}
.t-mint{--tint:var(--mint)}.t-blue{--tint:var(--blue)}.t-purple{--tint:var(--purple)}.t-peach{--tint:var(--peach)}.t-rose{--tint:var(--rose)}.t-sand{--tint:var(--sand)}

.btn{border:0;border-radius:var(--r-sm);padding:14px 20px;font-weight:600;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:52px;transition:transform .12s var(--ease),opacity .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.soft{background:var(--surface-2);color:var(--fg)}
.btn.small{padding:8px 14px;min-height:0;flex:0 0 auto;font-size:.86rem;border-radius:10px}
.actions{display:flex;gap:10px;margin-top:20px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:.86rem;font-weight:500;white-space:nowrap;transition:background .15s}
.chip .muted{font-variant-numeric:tabular-nums;margin-left:2px}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.on .muted{color:inherit;opacity:.6}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.deck{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;text-align:left;width:100%;transition:transform .15s var(--ease)}
.deck:active{transform:scale(.985)}
.deck .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.deck .ico svg{width:24px;height:24px}
.deck .meta{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.due{background:var(--primary-soft);color:var(--primary)}
.pill.new{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* hero */
.hero{background:var(--primary-deep);color:#fff;border-radius:var(--r-xl);padding:22px 20px 18px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:var(--bg)}}
.hero .lbl{font-size:.82rem;opacity:.7}
.hero .q{font-family:var(--serif);font-size:clamp(1.45rem,6vw,1.9rem);line-height:1.25;font-weight:500;margin:10px 0 6px;text-wrap:balance}
.hero .a{font-size:.95rem;opacity:.8;min-height:1.5em}
.hero .a.veil{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .3s}
.hero-stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:.82rem}
.hero-stats b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero-stats .s{color:var(--yellow)}

/* flashcard */
.flip{perspective:1400px;cursor:pointer;user-select:none}
.flip-in{display:grid;transition:transform .55s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip.out-l{animation:outL .28s var(--ease) forwards}.flip.out-r{animation:outR .28s var(--ease) forwards}
@keyframes outL{to{transform:translateX(-36px) rotate(-3deg);opacity:0}}
@keyframes outR{to{transform:translateX(36px) rotate(3deg);opacity:0}}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px 22px;min-height:min(56vh,360px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.phrase{font-family:var(--serif);font-size:clamp(1.5rem,6vw,2.05rem);font-weight:500;line-height:1.28;text-wrap:balance;letter-spacing:-.005em}
.trans{font-size:1.1rem;font-weight:600;color:var(--primary)}
.face.back .trans{font-size:1.3rem}
.note{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:.92rem}
.note b{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.hint{font-size:.84rem;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;animation:enter .2s var(--ease)}
.grade{border:0;border-radius:var(--r-sm);padding:11px 4px;font-weight:600;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.grade:active{transform:scale(.95)}
.grade small{font-weight:500;font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}
.grade.again{background:var(--bad-soft);color:var(--bad)}.grade.hard{background:var(--warn-soft);color:var(--warn)}
.grade.good{background:var(--primary-soft);color:var(--primary)}.grade.easy{background:var(--ok-soft);color:var(--ok)}

.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:15px 16px;font-weight:500;transition:background .15s,border-color .15s}
.opt.right{background:var(--ok-soft);border-color:var(--ok);animation:pop .3s var(--ease)}
.opt.wrong{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.02)}}

.zone{min-height:76px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tok{border:0;border-radius:10px;padding:9px 13px;font-weight:500;background:var(--primary);color:var(--primary-ink);animation:pop .18s}
.tok.pool{background:var(--surface-2);color:var(--fg);animation:none}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px;min-height:64px;font-size:.9rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere;hyphens:auto;transition:all .2s var(--ease);text-align:left}
.pc.l{font-family:var(--serif);font-weight:500}
.pc.r{background:var(--surface-2);border-color:transparent}
.pc{position:relative}
.pc.sel{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:600;transform:translateY(-1px)}
.pc.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);opacity:.6;pointer-events:none;padding-right:30px}
.pc.done::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:11px;margin-top:-7px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pc.just{opacity:1;animation:pop .35s var(--ease)}
.pc.err{background:var(--bad-soft);border-color:var(--bad);animation:shake .32s}

input[type=text],input[type=url],textarea,input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-size:16px}
#ans{font-family:var(--serif);font-size:1.15rem}
textarea{resize:vertical}
.fb{border-radius:var(--r-md);padding:14px 16px;font-size:.94rem;animation:enter .2s var(--ease)}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.warn{background:var(--warn-soft)}
.diff{font-family:var(--serif);font-size:1.02rem}
.diff del{color:var(--bad);text-decoration-thickness:2px}
.diff ins{color:var(--ok);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.dlg{line-height:1.75;font-family:var(--serif);font-size:1.02rem}
.dlg .sp{font-family:var(--font);font-size:.74rem;font-weight:700;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 6px;margin-right:6px}
.dlg mark{background:color-mix(in srgb,var(--yellow) 45%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:600;text-align:center}

.audio{width:44px;height:44px;border-radius:50%;border:0;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s}
.audio:active{transform:scale(.92)}
.audio svg{width:20px;height:20px}

.dict-row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:10px}
.dict-row:last-child{border-bottom:0}
.dict-row .meta{flex:1;min-width:0}
.dict-row .meta>b{font-family:var(--serif);font-weight:500;font-size:1.08rem}
.dict-row details{margin-top:6px}
.dict-row summary{font-size:.84rem;color:var(--primary);font-weight:600;cursor:pointer}

.kbd{font-size:.7rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.55}
.desk-only{display:none}
@media (hover:hover) and (pointer:fine){.desk-only{display:inline}.tile:hover,.deck:hover{border-color:var(--primary)}.opt:hover{border-color:var(--primary)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.9rem;font-weight:500;z-index:99;max-width:90%;text-align:center;box-shadow:var(--shadow);animation:up .25s var(--ease)}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .9s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;align-items:end}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;opacity:.75}
.week span{width:100%;border-radius:4px;display:block}
.summary-hero{text-align:center;padding:36px 20px;border-radius:var(--r-xl);background:var(--ok-soft)}
.summary-hero .n{font-family:var(--serif);font-size:3.2rem;line-height:1;font-weight:500;animation:pop .5s var(--ease)}
@media (min-width:640px){.wrap{padding-block:20px 72px}.card{padding:26px}}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}

/* ---- Economist layer ---- */
.topbar{border-top:4px solid var(--primary);border-bottom:1px solid var(--line);background:var(--bg)}
.topbar h1{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.progress>i{border-radius:0}
.icon-btn{background:transparent;border:1px solid var(--line)}
h2{font-family:var(--serif);font-weight:700}
.eyebrow{font-weight:700;font-size:.8rem;color:var(--primary);letter-spacing:.02em;position:relative;padding-top:10px}
.eyebrow::before{content:"";position:absolute;top:0;left:0;width:32px;height:3px;background:var(--primary)}
.card,.deck,.tile,.face,.opt,.pc{border-radius:6px}
.tile{justify-content:flex-start;gap:4px;padding-top:18px}
.tile::before{position:static;width:24px;height:3px;border-radius:0;background:var(--primary);margin-bottom:10px}
.tile h3,.deck h3{font-family:var(--serif);font-weight:700;font-size:1.08rem}
.btn{border-radius:999px;font-size:.95rem}
.btn.ghost{border-color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.chip{background:transparent;border:1px solid var(--line)}
.chip.on{background:var(--fg);border-color:var(--fg)}
.seg{border-radius:999px}.seg button{border-radius:999px}
.deck .ico{border-radius:4px}
.hero{background:var(--surface-2);color:var(--fg)!important;border-radius:6px;border-top:4px solid var(--primary);padding-top:18px}
.hero .lbl{font-weight:700;color:var(--primary);opacity:1}
.hero .q{font-weight:700;letter-spacing:-.01em}
.hero .a{color:var(--muted);opacity:1;font-family:var(--serif);font-size:1.05rem}
.hero-stats{border-top-color:var(--line)}
.hero-stats b{font-family:var(--serif);font-weight:700}
.hero-stats .s{color:var(--primary)}
.hero .btn[data-act="lesson"]{background:var(--primary)!important;color:var(--primary-ink)!important}
.hero .btn[data-act="flash"]{border-color:var(--fg)!important}
.phrase{font-weight:600;letter-spacing:-.01em}
.face{box-shadow:none;border-top:3px solid var(--fg)}
.face.back{border-top-color:var(--primary);background:var(--surface)}
.trans{color:var(--primary)}
.note{border-radius:4px;border-left:3px solid var(--line)}
.note b{color:var(--fg)}
.grade{border-radius:6px}
.grade.good{background:var(--navy-soft);color:var(--navy)}
.audio{background:transparent;border:1px solid var(--line);color:var(--fg)}
.pill{border-radius:3px;font-weight:700}
.pill.due{background:var(--primary-soft);color:var(--primary)}
.tok{background:var(--fg);color:var(--bg);border-radius:4px}
.tok.pool{border-radius:4px}
.zone{border-radius:4px}
.dlg mark{background:var(--primary-soft);color:var(--fg);box-shadow:inset 0 -2px 0 var(--primary)}
.dlg .sp{background:var(--fg);color:var(--bg)}
.blank{border-bottom-color:var(--primary);color:var(--primary)}
.dict-row summary{color:var(--navy)}
.summary-hero{border-radius:6px;border-top:4px solid var(--primary);background:var(--surface-2)!important}
.summary-hero .n{font-weight:700}
.toast{border-radius:4px}
.spin{border-top-color:var(--primary)}
@media (hover:hover) and (pointer:fine){.tile:hover,.deck:hover,.opt:hover{border-color:var(--fg)}}

/* ---- Best-practice layer: focus mode sessions, thumb-zone action bar, feedback sheet ---- */
body.sess .topbar h1{visibility:hidden}
body.sess .topbar [data-act="settings"]{display:none}
body.sess .progress{height:6px;background:var(--surface-2);margin:0 16px 8px;border-radius:99px;max-width:648px}
@media (min-width:712px){body.sess .progress{margin-inline:auto}}
body.sess .progress>i{border-radius:99px}
body.sess .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.sess .card:not(.keep){background:transparent;border:0;padding:4px 0 0}
body.sess .actions, body.sess #grades, body.sess #flipHint{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;
  padding:12px max(16px,calc((100vw - 648px)/2)) calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
body.sess #grades .grades{margin:0}
body.sess #grades .hint{margin:8px 0 0!important;text-align:center}
body.sess .actions .btn{min-height:54px;font-size:1.02rem}
body.sess #fb:not(:empty){position:fixed;left:0;right:0;z-index:29;bottom:calc(79px + env(safe-area-inset-bottom,0px));margin:0;
  padding:0 max(16px,calc((100vw - 648px)/2)) 0;animation:sheet .26s var(--ease)}
body.sess #fb .fb{border-radius:6px 6px 0 0;padding:16px 18px;box-shadow:0 -10px 24px -18px rgba(0,0,0,.4)}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.fb.ok{border-top:3px solid var(--ok)}.fb.bad{border-top:3px solid var(--bad)}.fb.warn{border-top:3px solid var(--warn)}
.fb .ttl{display:block;font-weight:700;font-size:1rem;margin-bottom:4px}
.fb.ok .ttl{color:var(--ok)}.fb.bad .ttl{color:var(--bad)}.fb.warn .ttl{color:var(--warn)}
.opt{display:flex;gap:14px;align-items:center;padding:14px 14px;min-height:60px}
.opt .k{width:28px;height:28px;flex-shrink:0;border:1px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.sess-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.sess-head .step{font-weight:700;color:var(--primary);font-size:.86rem}
.sess-head .cnt{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:4px}.dots i{width:18px;height:3px;background:var(--line)}.dots i.on{background:var(--fg)}.dots i.cur{background:var(--primary)}
/* home */
.dateline{font-size:.86rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1rem}
.hero-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.hero-top>div:first-child{min-width:0}
/* dictionary */
#search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;box-shadow:0 0 0 8px var(--bg)}
/* settings: grouped list */
.card.stack>h3{font-family:var(--serif);font-weight:700;font-size:1.15rem;padding-top:10px;position:relative}
.card.stack>h3::before{content:"";position:absolute;top:0;left:0;width:24px;height:3px;background:var(--primary)}

.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(13,13,13,.45);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:520px;background:var(--bg);border-top:4px solid var(--primary);border-radius:8px 8px 0 0;
  padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheet .26s var(--ease)}
.sheet h3{font-family:var(--serif);font-weight:700;font-size:1.3rem}
.sheet .btn{flex:none;width:100%;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:6px}}
body.sess .actions .btn.ghost{padding-inline:16px}
body.sess .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.tok.key{background:var(--primary);color:var(--primary-ink)}
.tok.pool.key{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 -2px 0 var(--primary)}
.note mark{background:var(--primary-soft);color:inherit;box-shadow:inset 0 -2px 0 var(--primary);padding:0 2px}
.diff mark{background:var(--primary-soft);color:inherit;padding:0 2px}

.tile.wide{grid-column:1/-1;min-height:0}
.br{color:var(--muted);font-weight:400}
.skel{font-family:var(--serif);font-size:1.12rem;line-height:1.7;letter-spacing:.02em;color:var(--muted);margin:16px 0 12px;padding:12px 14px;background:var(--surface-2);border-radius:4px;overflow-wrap:anywhere}
.skel mark{background:var(--primary-soft);color:var(--fg);box-shadow:inset 0 -2px 0 var(--primary);padding:0 2px;letter-spacing:0}
textarea#ans{font-family:var(--serif);font-size:1.12rem;line-height:1.45}

.tile.wide{grid-column:1/-1;min-height:0}
.bullet-tile h3{font-size:1.25rem}
.bullet-intro{padding:28px 0 0;display:flex;flex-direction:column;gap:14px}
.bullet-keys{display:flex;justify-content:space-between;font-weight:600;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bullet-keys b{color:var(--primary);font-size:1.2rem}
.bullet-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 8px}
.bullet-time{font-family:var(--serif);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch}
.bullet-time.low{color:var(--primary);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.bullet-score{color:var(--muted);font-size:.95rem}.bullet-score b{color:var(--fg);font-family:var(--serif);font-size:1.4rem;font-variant-numeric:tabular-nums}
.bullet-streak{color:var(--primary);font-weight:600}
.bullet-clock{height:4px;background:var(--surface-2);margin-bottom:22px}.bullet-clock i{display:block;height:100%;background:var(--primary);transition:width .2s linear}
.bcard{border:1px solid var(--line);border-top:3px solid var(--fg);border-radius:6px;padding:30px 22px;min-height:min(46vh,300px);display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;transition:transform .14s var(--ease),opacity .14s,border-color .1s,background .1s;touch-action:pan-y;user-select:none}
.bcard .phrase{font-size:clamp(1.6rem,7vw,2.2rem)}
.bcard-rule{width:32px;height:3px;background:var(--primary);margin:0 auto}
.bcard-ru{font-size:1.25rem;font-weight:500}
.bcard.hit{border-color:var(--ok);background:var(--ok-soft)}.bcard.miss{border-color:var(--bad);background:var(--bad-soft);animation:shake .32s}
.bcard.hit.go-r{transform:translateX(26px);opacity:.4}.bcard.hit.go-l{transform:translateX(-26px);opacity:.4}
.bullet-actions .btn{font-size:1.05rem}
.bullet-actions .bno{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}

.pc-say{float:right;margin:-4px -4px 4px 8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface)}
.pc-say svg{width:15px;height:15px}
.skip-ex{display:block;margin-top:6px;margin-left:auto;border:1px solid var(--fg);background:transparent;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600}
body.sess .actions .audio{width:54px;height:54px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <button class="icon-btn" id="backBtn" data-act="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Business English</h1>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<main class="wrap" id="app"></main>

<script>
/* ============================================================
   Business English Trainer (offline edition)
   - Data: two published Google Sheets (TSV). Cached in localStorage,
     so after one successful load the app works with no network.
   - Progress: SM-2 style spaced repetition, namespaced per deck.
   - No AI calls. Everything below runs in the browser.
   ============================================================ */

// ---------- 1. Config & storage ----------
const DEFAULT_SOURCES = {
  phr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSgas0kuEQP66HKOAGuHKTFy2K2PYdGBhFbcsFG-pppwct7mcrpBHs5-G_iLUgGmu8xLJEf-DVAdpPH/pub?output=tsv',
  voc: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRdmq2vg_mur1e-GiVxLgZ2KBNddV_xEhV-jY5J0V1VUMh0GBgBQcJ5_ZRoK24UKIiKLXN29rOoYAzV/pub?gid=974599349&single=true&output=tsv'
};
const DECKS = {
  phr: { name:'Phrases & Functions', short:'Phrases', sub:'Mode 1 · meeting language, dialogues', tone:'t-mint', icoBg:'var(--primary-soft)', icoFg:'var(--primary)' },
  voc: { name:'Vocabulary & Chunks', short:'Vocabulary', sub:'Mode 2 · finance, workflow, idioms', tone:'t-peach', icoBg:'var(--peach)', icoFg:'var(--bad)' }
};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('Could not save locally. Storage is full or blocked.'); } }
};
const K = { srs:'bet.srs.v2', data:'bet.data.v2', cfg:'bet.cfg.v2', log:'bet.log.v2' };

let cfg = Object.assign({ sources:{...DEFAULT_SOURCES}, dir:'en-ru', newPerDay:10, lessonSize:7, autoSpeak:true, theme:'system' }, LS.get(K.cfg, {}));
let srs = LS.get(K.srs, {});
let log = LS.get(K.log, {});        // { 'YYYY-MM-DD': {rev:n, ok:n} }
let data = LS.get(K.data, { phr:null, voc:null }); // { items:[], at:ts }
applyTheme();

// One-time migration of the old shared SRS store (keys were bare ids, shared by both modes)
(function migrate(){
  const old = LS.get('businessEnglishSRS', null);
  if (!old || LS.get('bet.migrated', false)) return;
  Object.entries(old).forEach(([id, v]) => {
    ['phr','voc'].forEach(d => { if (!srs[d+':'+id]) srs[d+':'+id] = { ivl:v.interval||0, ease:v.ease||2.5, due:v.nextReview||Date.now(), reps:v.interval?1:0, lapses:0, seen:true }; });
  });
  LS.set(K.srs, srs); LS.set('bet.migrated', true);
})();

// ---------- 2. Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const today = (d=new Date()) => d.toISOString().slice(0,10);
const DAY = 86400000, MIN = 60000;
function toast(msg){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function bar(p){ $('#bar').style.width = Math.max(0,Math.min(100,p))+'%'; }
function applyTheme(){ const r=document.documentElement; if(cfg.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', cfg.theme); }
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis?.getVoices()||[]).filter(v=>/^en[-_]/i.test(v.lang)); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\*\*/g,''));
  u.lang='en-US'; u.rate=0.92;
  const v = voices.find(v=>/en-US/i.test(v.lang) && /natural|enhanced|premium|samantha|google/i.test(v.name)) || voices.find(v=>/en-US/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const ICON = {
  audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};
function buzz(ms=30){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
const audioBtn = t => `<button class="audio" data-act="say" data-t="${esc(t)}" aria-label="Play audio">${ICON.audio}</button>`;

// text normalisation + typo tolerance
const norm = s => String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
// [placeholders] in a phrase are optional when typing: "explain [the concept] to sb" accepts both forms
const stripBr = t => String(t).replace(/\[[^\]]*\]/g,' ').replace(/\s+/g,' ').trim();
const variants = t => [...new Set([stripBr(t), String(t).replace(/[\[\]]/g,'')])];
function check1(input, target){
  const a=norm(input), b=norm(target);
  if (a===b) return 'exact';
  const tol = b.length>60?Math.min(6,Math.ceil(b.length/20)):b.length>20?3:b.length>8?2:b.length>4?1:0;
  return lev(a.replace(/ /g,''), b.replace(/ /g,'')) <= tol ? 'typo' : 'wrong';
}
function check(input, target){ const r=variants(target).map(t=>check1(input,t)); return r.includes('exact')?'exact':r.includes('typo')?'typo':'wrong'; }
// the variant closest to what was typed, for feedback diffs
function bestTarget(input, target){ const a=norm(input).replace(/ /g,''); return variants(target).sort((x,y)=>lev(a,norm(x).replace(/ /g,''))-lev(a,norm(y).replace(/ /g,'')))[0]; }
// show [placeholders] dimmed
const showBr = t => esc(t).replace(/\[([^\]]*)\]/g,'<span class="br">[$1]</span>');
// word-level diff for feedback (LCS)
function diff(input, target){
  const A=input.trim().split(/\s+/), B=target.trim().split(/\s+/), n=A.length, m=B.length;
  const L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= norm(A[i])===norm(B[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out=[];
  while(i<n&&j<m){ if(norm(A[i])===norm(B[j])){out.push(esc(B[j]));i++;j++;} else if(L[i+1][j]>=L[i][j+1]){out.push('<del>'+esc(A[i])+'</del>');i++;} else {out.push('<ins>'+esc(B[j])+'</ins>');j++;} }
  while(i<n) out.push('<del>'+esc(A[i++])+'</del>'); while(j<m) out.push('<ins>'+esc(B[j++])+'</ins>');
  return out.join(' ');
}

// ---------- 3. Parsing (same column logic as before) ----------
function splitTSV(t){ return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t').map(c=>c.trim())); }
function parsePhr(t){
  const rows=splitTSV(t); if(!rows.length) return [];
  const h=rows[0].map(x=>x.toLowerCase()); const f=(p,d)=>{const i=h.findIndex(p);return i===-1?d:i;};
  const id=f(x=>x==='#',0), en=f(x=>x.includes('universal phrase'),1), ru=f(x=>x.includes('native translation'),2),
        cat=f(x=>x.includes('category'),3), intent=f(x=>x.includes('strategic intent'),4), dl=f(x=>x.includes('dialogue'),-1);
  return rows.slice(1).filter(c=>c[en]&&c[ru]).map((c,i)=>({
    deck:'phr', id:String(parseInt(c[id])||i+1), en:c[en], ru:c[ru], cat:c[cat]||'Uncategorized',
    note:c[intent]||'', example:'', dialogue: dl>-1 ? (c[dl]||'') : ''
  }));
}
// Examples may sit in two columns or together in one cell ("1) ... 2) ...", line breaks, " / ", or plain sentences)
function splitExamples(cells){
  const out=[];
  cells.filter(Boolean).forEach(c=>{
    let parts=c.split(/\s*(?:\n|\s\/\s|\|\||;\s(?=[A-Z])|\s(?=\(?\d[.)]\s))\s*/);
    if(parts.length===1) parts=c.split(/(?<=[.!?])\s+(?=[A-Z"“'])/);
    parts.map(x=>x.replace(/^\(?\d[.)]\s*/,'').replace(/^[-•]\s*/,'').replace(/\*\*/g,'').trim()).filter(x=>x.split(/\s+/).length>=3).forEach(x=>out.push(x));
  });
  return out.slice(0,4);
}
function parseVoc(t){
  const rows=splitTSV(t); if(!rows.length) return [];
  const h=rows[0].map(x=>x.toLowerCase()); const has=k=>x=>k.some(w=>x.includes(w));
  let en=h.findIndex(has(['en','english','phrase','фраза','английский'])), ru=h.findIndex(has(['ru','russian','translation','перевод','русский']));
  const ctx=h.findIndex(has(['context','topic','контекст','тема'])), list=h.findIndex(has(['list','category','список','категория','раздел'])),
        id=h.findIndex(x=>x==='id'), ex=h.findIndex(has(['explanation','объяснение','значение','meaning']));
  const exCols=h.map((x,i)=>/example|пример|sentence|usage/.test(x)?i:-1).filter(i=>i>-1);
  const header = en>-1||ru>-1; if(en===-1) en=0; if(ru===-1) ru=1;
  const rename = n => /1/.test(n)?'Hard Business':/2/.test(n)?'Workflow':/3/.test(n)?'Vibe & Idioms':n;
  return rows.slice(header?1:0).filter(c=>c[en]&&c[ru]).map((c,i)=>({
    deck:'voc', id:String((id>-1&&parseInt(c[id]))||i+1), en:c[en], ru:c[ru],
    cat: rename(list>-1&&c[list]?c[list]:'Main List'), note:ex>-1?c[ex]||'':'', examples:splitExamples(exCols.map(j=>c[j]||'')), example:exCols.map(j=>c[j]||'').filter(Boolean).join(' / '),
    ctx: ctx>-1?c[ctx]||'':'', dialogue:''
  }));
}
const CAT_DESC = {
  'Clarification':'Clarifying details and softly requesting elaboration without losing authority.',
  'Polite Disagreement':'Politely disagreeing and diplomatically challenging a position.',
  'Hedging':'Softening categorical statements to keep flexibility and limit risk.',
  'Summarizing':'Summarizing outcomes and documenting agreements reached.',
  'Elaborating & Exemplifying':'Expanding an argument and giving concrete business examples.',
  'Returning to the point':'Steering the conversation back to the main topic.',
  'Conceding a point':'Making a strategic concession to move a negotiation forward.',
  'Floor Management':'Taking the floor politely or handing it to others.'
};

async function loadDeck(deck, {force=false}={}){
  const cached = data[deck];
  if (cached && !force) return cached;
  try{
    const r = await fetch(cfg.sources[deck], {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const items = (deck==='phr'?parsePhr:parseVoc)(await r.text());
    if(!items.length) throw new Error('The sheet returned no rows');
    data[deck] = { items, at:Date.now() }; LS.set(K.data, data);
    return data[deck];
  }catch(e){
    if (cached){ toast('Offline. Using the copy saved '+fmtAgo(cached.at)+'.'); return cached; }
    throw e;
  }
}
function fmtAgo(ts){ const d=Math.round((Date.now()-ts)/DAY); return d<=0?'today':d===1?'yesterday':d+' days ago'; }

// ---------- 4. Spaced repetition (SM-2 variant, 4 grades) ----------
// Widened for a large, growing library (days):
//   again → 1d · hard → 2d, then ×1.2 · good → 4d, then ×ease · easy → 21d, then ×ease×1.3 · cap 365d
const MAX_IVL=365;
function nextIvl(c, g){
  const v=c.ivl||0, e=c.ease||2.5;
  if(g==='again') return 1;
  if(g==='hard')  return v===0?2:Math.max(v+1,Math.round(v*1.2));
  if(g==='good')  return v===0?4:Math.max(v+2,Math.round(v*e));
  return v===0?21:Math.max(21,Math.round(v*e*1.3));
}
const fmtIvl = d => d<30 ? d+'d' : d<365 ? (d/30).toFixed(1).replace('.0','')+'mo' : (d/365).toFixed(1).replace('.0','')+'y';
const keyOf = it => it.deck+':'+it.id;
const card = it => srs[keyOf(it)];
const isNew = it => !card(it);
const isDue = it => { const c=card(it); return !!c && c.due <= Date.now(); };
function preview(it, g){
  const c = card(it) || {ivl:0, ease:2.5};
  return fmtIvl(Math.min(MAX_IVL, nextIvl(c,g)));
}
function grade(it, g){
  const k=keyOf(it), c = srs[k] || {ivl:0, ease:2.5, reps:0, lapses:0, src:st.S?.kind==='flash'?'cards':'lesson'};
  const ni = Math.min(MAX_IVL, nextIvl(c,g));
  if (g==='again'){ c.lapses=(c.lapses||0)+(c.reps?1:0); c.ease=Math.max(1.3,c.ease-0.2); c.ivl=0; }
  else {
    if (g==='hard') c.ease=Math.max(1.3,c.ease-0.15);
    if (g==='easy') c.ease=Math.min(3.0,c.ease+0.15);
    c.ivl=ni;
  }
  const fuzz = ni>3 ? Math.round(ni*0.05*(Math.random()*2-1)) : 0;
  c.due = startOfDay(Date.now()+(ni+fuzz)*DAY);
  c.reps=(c.reps||0)+1; c.last=Date.now(); srs[k]=c; LS.set(K.srs, srs);
  bump(g!=='again');
}
// An error in a production exercise brings the card back tomorrow
function softLapse(it){ const k=keyOf(it), c=srs[k]; if(!c) return; c.ease=Math.max(1.3,c.ease-0.1); c.ivl=Math.min(c.ivl,2); c.due=startOfDay(Date.now()+DAY); LS.set(K.srs,srs); }
function startOfDay(ts){ const d=new Date(ts); d.setHours(4,0,0,0); return d.getTime(); }
function bump(ok){ const t=today(); log[t]=log[t]||{rev:0,ok:0,new:0}; log[t].rev++; if(ok) log[t].ok++; LS.set(K.log,log); }
function newToday(deck){ return Object.entries(srs).filter(([k,c])=>k.startsWith(deck+':') && c.reps===1 && c.src!=='cards' && c.last && today(new Date(c.last))===today()).length; }
function streak(){ let s=0, d=new Date(); if(!log[today(d)]) d.setDate(d.getDate()-1); while(log[today(d)]){ s++; d.setDate(d.getDate()-1);} return s; }
function status(it){
  const c=card(it); if(!c) return '<span class="pill new">New</span>';
  if(c.due<=Date.now()) return '<span class="pill due">Due</span>';
  const d=Math.ceil((c.due-Date.now())/DAY); return `<span class="pill ${c.ivl>=21?'ok':''}">${c.ivl>=21?'Mature · ':''}in ${d}d</span>`;
}

// ---------- 5. State & router ----------
const st = { view:'home', deck:null, cat:'all', q:'', S:null };
const pool = () => (data[st.deck]?.items||[]).filter(i=>st.cat==='all'||i.cat===st.cat);
const actions = {};
document.addEventListener('click', e => { const el=e.target.closest('[data-act]'); if(!el) return; const f=actions[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset, el, e); } });

function go(view){ st.view=view; render(); window.scrollTo(0,0); }
function render(){
  if(!(st.view==='session' && st.S?.step==='bullet' && st.S.b?.end)) stopBulletTimer();
  const app=$('#app'); $('#backBtn').hidden = st.view==='home';
  document.body.classList.toggle('sess', st.view==='session' && st.S && st.S.step!=='summary');
  document.body.classList.toggle('bul', st.view==='session' && st.S?.step==='bullet');
  $('#backBtn').innerHTML = document.body.classList.contains('sess') ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  $('#backBtn').setAttribute('aria-label', document.body.classList.contains('sess')?'End session':'Back');
  const V = { home:vHome, deck:vDeck, dict:vDict, settings:vSettings, session:vSession, loading:()=>'<div class="spin"></div>' };
  if(st.view!=='session') bar(0);
  $('#title').textContent = st.view==='home' ? 'Business English' : st.view==='settings' ? 'Settings' : DECKS[st.deck]?.short || '';
  app.innerHTML = V[st.view]();
  const sig=st.view+'|'+(st.S?st.S.step+st.S.i:''); if(sig!==st.lastSig){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); st.lastSig=sig; }
  afterRender();
}
actions.back = () => {
  if (st.view==='session' && st.S && st.S.step!=='summary') return openExit();
  closeExit(); st.S=null; speechSynthesis?.cancel(); go(st.view==='deck'||st.view==='settings'?'home':'deck');
};
actions.say = d => speak(d.t);
actions.unveil = (d,el) => el.classList.toggle('veil');

// ---------- 6. Home ----------
function counts(deck){
  const items=data[deck]?.items||[];
  const due=items.filter(isDue).length, fresh=items.filter(isNew).length;
  const newLeft=Math.max(0,cfg.newPerDay-newToday(deck));
  return { total:items.length, due, fresh, newLeft:Math.min(newLeft,fresh) };
}
function vHome(){
  const t=log[today()]||{rev:0,ok:0};
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {k:today(d),l:'MTWTFSS'[(d.getDay()+6)%7]};});
  const mx=Math.max(10,...days.map(d=>log[d.k]?.rev||0));
  const deckCard = k => { const c=counts(k), D=DECKS[k], loaded=!!data[k];
    return `<button class="deck" data-act="openDeck" data-d="${k}">

// A session is an ordered list of steps over a set of items.
function reviewQueue(){
  const p=pool(), now=Date.now();
  const due=p.filter(isDue).sort((a,b)=>{const A=card(a),B=card(b); return (A.ivl===0?0:1)-(B.ivl===0?0:1) || A.ease-B.ease || A.due-B.due;});
  const fresh=shuffle(p.filter(isNew)).slice(0,Math.max(0,cfg.newPerDay-newToday(st.deck)));
  return [...due, ...fresh];
}
// Cards mode: no daily cap. Due first, then every new card, then the rest by soonest due date.
function cardsQueue(){
  const p=pool(), due=reviewQueue().filter(isDue), fresh=shuffle(p.filter(isNew));
  const rest=p.filter(i=>!isNew(i)&&!isDue(i)).sort((a,b)=>card(a).due-card(b).due);
  return [...due, ...fresh, ...rest];
}
function newSession(o){ st.S=Object.assign({ i:0, misses:new Set(), skipped:new Set(), done:0, practised:0 }, o); st.S.step=st.S.steps[0]; go('session'); }
actions.lesson = () => {
  const q=reviewQueue(); if(!q.length) return toast('All caught up for today.');
  const steps = st.deck==='phr' ? ['sort','learn','match','scramble','cloze','summary'] : ['sort','learn','match','pairs','scramble','spell','summary'];
  newSession({ kind:'lesson', queue:q, items:[], hard:[], steps });
};
actions.flash = () => { const q=cardsQueue(); if(!q.length) return toast('No cards in this filter.'); newSession({ kind:'flash', queue:q, items:[], hard:[], steps:['sort','summary'] }); };
actions.drill = d => {
  if(d.k==='bullet') return startBullet();
  let p=pool(); if(d.k==='dialogue'||d.k==='cloze') p=p.filter(i=>i.dialogue);
  if(d.k==='sentence'||d.k==='scrambleEx') p=p.filter(i=>i.examples?.length);
  if(!p.length) return toast('Nothing to practise in this filter.');
  // weakest first: due, then low ease, then random
  const w = it => { const c=card(it); return !c?1.5 : (c.due<=Date.now()?0:1) + c.ease/3; };
  const items = shuffle(p).sort((a,b)=>w(a)-w(b)).slice(0, d.k==='pairs'?6:10);
  newSession({ kind:'drill', items:shuffle(items), steps:[d.k,'summary'] });
};
function nextStep(){
  const S=st.S; let idx=S.steps.indexOf(S.step)+1;
  while(idx<S.steps.length){
    const s=S.steps[idx];
    if(s==='summary') break;
    if(!S.items.length){ idx=S.steps.length-1; break; }
    if(s==='cloze' && !S.items.some(i=>i.dialogue)){ idx++; continue; }
    if((s==='sentence'||s==='scrambleEx') && !S.items.some(i=>i.examples?.length)){ idx++; continue; }
    break;
  }
  S.step=S.steps[Math.min(idx,S.steps.length-1)]; S.i=0; S.sub=null;
  if(S.step==='cloze') S.list=S.items.filter(i=>i.dialogue);
  if(S.step==='sentence'||S.step==='scrambleEx') S.list=S.items.filter(i=>i.examples?.length);
  render(); window.scrollTo(0,0);
}
const list = () => st.S.step==='sort' ? st.S.queue : (st.S.list && (st.S.step==='cloze'||st.S.step==='sentence'||st.S.step==='scrambleEx') && st.S.kind!=='drill' ? st.S.list : st.S.items);
const cur = () => list()[st.S.i];
function markActive(){ const t=today(); log[t]=log[t]||{rev:0,ok:0,new:0}; log[t].prac=(log[t].prac||0)+1; LS.set(K.log,log); }
function advance(){ const S=st.S; markActive(); S.practised++; S.i++; S.sub=null; if(S.i>=list().length) nextStep(); else { render(); } }
const front = it => cfg.dir==='en-ru' ? it.en : it.ru;
const back  = it => cfg.dir==='en-ru' ? it.ru : it.en;
const notes = it => [it.note&&`<div class="note"><b>${it.deck==='phr'?'Strategic intent':'Explanation'}</b>${esc(it.note)}</div>`, (it.examples?.length?`<div class="note"><b>${it.examples.length>1?'Examples':'Example'}</b>${it.examples.map(x=>`<div style="font-family:var(--serif);margin-top:4px">${hl(x,it.en)}</div>`).join('')}</div>`:it.example&&`<div class="note"><b>Example</b><em>${esc(it.example)}</em></div>`)].filter(Boolean).join('');
const stepLabel = { sort:'Review', learn:'Memorise', match:'Match', scramble:'Scramble', cloze:'Fill the gap', dialogue:'Dialogue', spell:'Recall', pairs:'Quick pairs', sentence:'Write the sentence', scrambleEx:'Scramble sentence' };
function head(){ const S=st.S, L=list(), stepN=S.steps.filter(s=>s!=='summary'), k=stepN.indexOf(S.step);
  const frac = S.kind==='drill'||S.kind==='flash' ? S.i/L.length : (k+S.i/Math.max(1,L.length))/stepN.length; bar(frac*100);
  return `<div class="sess-head"><div><div class="step">${stepLabel[S.step]}</div>${stepN.length>1?`<div class="dots" style="margin-top:6px" aria-label="Step ${k+1} of ${stepN.length}">${stepN.map((_,j)=>`<i class="${j<k?'on':j===k?'cur':''}"></i>`).join('')}</div>`:''}</div><div style="text-align:right"><span class="cnt">${Math.min(S.i+1,L.length)} of ${L.length}</span>${S.kind==='lesson'&&S.i===0&&S.step!=='sort'&&k<stepN.length-1?`<button class="skip-ex" data-act="skipStep">Skip exercise</button>`:''}</div></div>`; }

function vSession(){
  const S=st.S; if(!S) return '';

}

  if(norm(got)===norm(S.sub.target)){ $('#fb').innerHTML='<div class="fb ok"><span class="ttl">Correct</span></div>'; if(cfg.autoSpeak) speak(S.sub.target); setTimeout(advance,S.sub.chunk?1600:900); }

  setTimeout(()=>{ S.sub=buildScramble(t,ch); render(); },ch?3200:2200); };
// Sentence → shuffled tiles. The chunk stays one highlighted tile so the drill is about its position in context.
function buildScramble(text, chunk){
  const target=text.trim().replace(/\s+/g,' ');
  let toks=[];
  const m = chunk && findChunk(target, chunk);
  if(m){ const pre=target.slice(0,m.i).trim(), post=target.slice(m.i+m.len).trim();
    toks=[...(pre?pre.split(' '):[]).map(t=>({t})), {t:target.substr(m.i,m.len),key:true}, ...(post?post.split(' '):[]).map(t=>({t}))]; }
  else toks=target.split(' ').map(t=>({t}));
  toks.forEach((x,i)=>x.i=i);
  let p=shuffle(toks); if(toks.length>1&&p.every((x,k)=>x.i===k)) p=p.reverse();
  return {pool:p, pick:[], target, chunk:chunk||null};
}
function findChunk(text, chunk){
  const core=chunk.replace(/\(.*?\)|\b(sb|sth|smb|smth|someone|something)\b|[\/…]|\.\.\./gi,' ').trim().split(/\s+/).filter(w=>w.length>1);
  if(!core.length) return null;
  const re=new RegExp(core.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/(e|s|y|ed|ing)$/i,'').replace(/-/g,'[-\\s]?')+"[\\w'’-]*").join("(?:\\s+[\\w'’-]+){0,2}?\\s+"),'i');
  const r=text.match(re); return r?{i:r.index,len:r[0].length}:null;
}
function hl(text, chunk){ const m=findChunk(text,chunk); return m?esc(text.slice(0,m.i))+'<mark>'+esc(text.substr(m.i,m.len))+'</mark>'+esc(text.slice(m.i+m.len)):esc(text); }

// 8e. Dialogue read & cloze
function fmtDialogue(text, mode){ // mode: 'show' | 'blank' | 'reveal'
  let h=esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, (_,m)=> mode==='blank' ? '<span class="blank">&nbsp;?&nbsp;</span>' : `<mark>${m}</mark>`);
  return h.replace(/(^|\s)([AB]):\s*/g, (_,s,w)=>`${s?'<br><br>':''}<span class="sp">${w}</span>`).replace(/\n/g,'<br>');
}
function blankByPhrase(it){ return /\*\*/.test(it.dialogue) ? it.dialogue : it.dialogue.replace(new RegExp(it.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), m=>'**'+m+'**'); }
const expected = it => (it.dialogue.match(/\*\*(.+?)\*\*/)||[])[1] || it.en;
function vDialogue(){ const it=cur(); return `<div class="card"><div class="phrase" style="font-size:1.25rem">${esc(it.en)}</div><div class="muted">${esc(it.ru)}</div>
  <div class="dlg note" style="margin-top:14px">${fmtDialogue(blankByPhrase(it),'show')}</div>
  <div class="actions" style="align-items:center">${audioBtn(it.en)}<button class="btn" data-act="next">Continue</button></div></div>`; }
function vCloze(){ const it=cur(); return `<div class="card"><div class="dlg note">${fmtDialogue(blankByPhrase(it),'blank')}</div>
  <p style="margin:14px 0 8px"><b>Meaning:</b> ${esc(it.ru)}</p>${it.note?`<p class="hint" style="margin:0 0 12px">${esc(it.note)}</p>`:''}
  <form id="typeForm"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing phrase"></form>
  <div id="fb" style="margin-top:12px"></div>
  <div class="actions">${audioBtn(expected(it))}<button class="btn ghost" data-act="giveup" style="flex:0 0 auto">Show</button><button class="btn ghost" data-act="skipItem" style="flex:0 0 auto">Skip</button><button class="btn" data-act="typeCheck">Check</button></div></div>`; }

// 8f2. Write the sentence (Duolingo-style dictation of a full example)
function vSentence(){
  const S=st.S, it=cur();
  if(!S.sub){ const ex=it.examples?.length?it.examples[Math.floor(Math.random()*it.examples.length)]:it.en; S.sub={target:ex}; }
  const t=S.sub.target, m=findChunk(t,it.en);
  const mask = w => w.replace(/[\p{L}\p{N}]/gu,(c,i)=>i===0?c:'·');
  const words = (a,b)=>a.split(' ').filter(Boolean).map(mask).join(' ');
  const skel = m ? esc(words(t.slice(0,m.i)))+' <mark>'+esc(t.substr(m.i,m.len))+'</mark> '+esc(words(t.slice(m.i+m.len))) : esc(words(t));
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:12px">
    <div style="min-width:0"><div class="hint" style="margin-bottom:4px">Listen and type the full sentence</div><div class="phrase" style="font-size:1.25rem">${esc(it.en)}</div><div class="muted" style="margin-top:2px">${esc(it.ru)}</div></div>
    ${audioBtn(t)}</div>
  <div class="skel">${skel}</div>
  <form id="typeForm"><textarea id="ans" rows="3" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Type what you hear"></textarea></form>
  <div id="fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn ghost" data-act="giveup" style="flex:0 0 auto">Show</button><button class="btn ghost" data-act="skipItem" style="flex:0 0 auto">Skip</button><button class="btn" data-act="typeCheck">Check</button></div></div>`;
}

// 8f. Recall (type the English)
function vSpell(){ const it=cur(), core=stripBr(it.en)||it.en, L=core.split(/\s+/).length, opt=/\[/.test(it.en);
  return `<div class="card"><div class="trans" style="font-size:1.3rem;color:var(--fg)">${esc(it.ru)}</div>
  <p class="hint" style="margin:6px 0 14px">${L} word${L>1?'s':''} · starts with “${esc(core[0])}…”${opt?' · [brackets] optional':''}</p>
  <form id="typeForm"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="English phrase"></form>
  <div id="fb" style="margin-top:12px"></div>
  <div class="actions">${audioBtn(it.en)}<button class="btn ghost" data-act="giveup" style="flex:0 0 auto">Show</button><button class="btn ghost" data-act="skipItem" style="flex:0 0 auto">Skip</button><button class="btn" data-act="typeCheck">Check</button></div></div>`; }
actions.typeCheck = () => {
  const S=st.S, it=cur(), inp=$('#ans'), v=inp.value.trim(); if(!v) return inp.focus();
  const full=typeTarget(it), r=check(v,full), target=bestTarget(v,full);
  if(S.sub?.locked) return;
  if(r==='wrong'){ S.misses.add(it); softLapse(it); buzz(); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); $('#fb').innerHTML=`<div class="fb bad"><span class="ttl">Not quite</span><div class="diff">${diff(v,target)}</div><div class="hint" style="margin-top:6px">Type it correctly to continue.</div></div>`; inp.select(); return; }
  S.sub=Object.assign(S.sub||{},{locked:true}); inp.disabled=true;
  $('#fb').innerHTML = r==='exact' ? `<div class="fb ok"><span class="ttl">Correct</span>${S.step==='cloze'?`<div class="dlg" style="margin-top:8px">${fmtDialogue(blankByPhrase(it),'show')}</div>`:''}</div>`
                                    : `<div class="fb warn"><span class="ttl">Accepted, watch the spelling</span><div class="diff">${diff(v,target)}</div></div>`;
  if(cfg.autoSpeak) speak(target); setTimeout(advance, S.step==='cloze'?2200:r==='exact'?(S.step==='sentence'?1300:700):2000);
};
const typeTarget = it => st.S.step==='cloze' ? expected(it) : st.S.step==='sentence' ? st.S.sub.target : it.en;
actions.giveup = () => { const S=st.S, it=cur(), target=typeTarget(it); if(S.sub?.locked) return; S.misses.add(it); softLapse(it);
  $('#fb').innerHTML=`<div class="fb warn"><span class="ttl">Answer</span><div class="diff">${showBr(target)}</div><div class="hint" style="margin-top:4px">Type it once to lock it in.</div></div>`; if(cfg.autoSpeak) speak(target); $('#ans').value=''; $('#ans').focus(); };

// 8g. Quick pairs (boards of up to 6)
function vPairs(){
  const S=st.S;
  if(!S.sub){ const start=S.i, chunk=S.items.slice(start,start+6); S.sub={chunk, L:shuffle(chunk), R:shuffle(chunk), sel:null, done:[]}; }
  const s=S.sub, c=(it,side)=>`<button class="pc ${side} ${s.done.includes(it)?'done':''} ${s.just===it?'just':''} ${s.sel&&s.sel.it===it&&s.sel.side===side?'sel':''}" data-act="pair" data-side="${side}" data-k="${s.chunk.indexOf(it)}">${esc(side==='l'?it.en:it.ru)}${side==='l'&&!s.done.includes(it)?`<span class="pc-say" data-act="say" data-t="${esc(it.en)}" role="button" aria-label="Play audio">${ICON.audio}</span>`:''}</button>`;
  return `<div class="pairs"><div>${s.L.map(i=>c(i,'l')).join('')}</div><div>${s.R.map(i=>c(i,'r')).join('')}</div></div>`;
}
actions.pair = (d, el) => {
  const S=st.S, s=S.sub, it=s.chunk[+d.k];
  if(!s.sel || s.sel.side===d.side){ s.sel = (s.sel&&s.sel.it===it&&s.sel.side===d.side)?null:{it,side:d.side}; return render(); }
  if(s.sel.it===it){ s.done.push(it); s.sel=null; markActive(); s.just=it; buzz(12); setTimeout(()=>{ if(s.just===it){ s.just=null; document.querySelectorAll('.pc.just').forEach(e=>e.classList.remove('just')); } },700);
    if(s.done.length===s.chunk.length){ S.i+=s.chunk.length; S.practised+=s.chunk.length; S.sub=null; render(); if(S.i>=S.items.length) setTimeout(nextStep,350); return; }
    return render(); }
  S.misses.add(it); S.misses.add(s.sel.it); buzz(); el.classList.add('err'); document.querySelector('.pc.sel')?.classList.add('err');
  setTimeout(()=>{ s.sel=null; render(); },380);
};

// 8h. Summary
function vSummary(){
  bar(100); const S=st.S, m=[...S.misses].filter(x=>!S.skipped.has(x)), sk=[...S.skipped];
  const n=S.kind==='drill'?Math.max(0,S.practised-sk.length):S.done; const rev=[...m,...sk];
  return `<div class="summary-hero" style="${m.length?'background:var(--primary-soft)':''}">
    <div class="n">${n}</div><h2 style="margin:10px 0 4px;font-size:1.25rem">${S.kind==='drill'?'items practised':'cards reviewed'}</h2>
    <p class="muted" style="margin:0">${S.early?'Finished early. ':''}${m.length?`${m.length} missed`:'No mistakes'}${sk.length?`, ${sk.length} skipped`:''}</p></div>
  ${sk.length?`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Skipped</div>${sk.map(it=>`<div class="dict-row"><div class="meta"><b>${esc(it.en)}</b><div class="muted">${esc(it.ru)}</div></div>${audioBtn(it.en)}</div>`).join('')}</div>`:''}
  ${m.length?`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Missed</div>${m.map(it=>`<div class="dict-row"><div class="meta"><b>${esc(it.en)}</b><div class="muted">${esc(it.ru)}</div></div>${audioBtn(it.en)}</div>`).join('')}</div>`:''}
  <div class="actions" style="flex-direction:column">
    ${rev.length?`<button class="btn" data-act="retry">Retry missed and skipped (${rev.length})</button>`:''}
    <button class="btn ${rev.length?'ghost':''}" data-act="back">Back to deck</button></div>`;
}
actions.retry = () => { const m=shuffle([...new Set([...st.S.misses,...st.S.skipped])]); newSession({kind:'drill', items:m, steps:['spell','summary']}); };

// ---------- 9. Dictionary ----------
function vDict(){

  return `<div class="stack"><input type="search" id="search" placeholder="Search EN, RU or notes" value="${esc(st.q)}">
  <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.85rem">${p.length} items</span><button class="btn ghost small" data-act="copyDict">Copy list</button></div>
  <div class="card" style="padding-block:4px">${p.length?p.map(w=>`<div class="dict-row"><div class="meta"><b>${esc(w.en)}</b><div class="muted">${esc(w.ru)}</div>
    <div class="row" style="gap:6px;margin-top:6px">${status(w)}<span class="pill">${esc(w.cat)}</span></div>
    ${w.note||w.example||w.dialogue?`<details><summary>Details</summary><div class="stack" style="gap:8px;margin-top:8px">${notes(w)}${w.dialogue?`<div class="note dlg">${fmtDialogue(blankByPhrase(w),'show')}</div>`:''}</div></details>`:''}
    </div>${audioBtn(w.en)}</div>`).join(''):'<p class="muted" style="text-align:center">No matches.</p>'}</div></div>`;
}
actions.copyDict = () => { const q=norm(st.q); copy(pool().filter(w=>!q||norm(w.en+' '+w.ru+' '+w.note).includes(q)).map(w=>`${w.en} - ${w.ru}${w.note?` [${w.note}]`:''}`).join('\n'), 'List copied'); };
function copy(text, msg){ (navigator.clipboard?.writeText(text)||Promise.reject()).then(()=>toast(msg)).catch(()=>{ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');toast(msg);}catch(e){toast('Copy blocked. Select the text manually.');} t.remove(); }); }

actions.settings = () => { if(st.view==='settings') return; st.prev=st.view==='session'?'deck':st.view; cfg.importDeck=cfg.importDeck||'phr'; st.wipeArm=false; go('settings'); };
actions.set = d => { let v=d.v; if(v==='true')v=true; else if(v==='false')v=false; else if(/^\d+$/.test(v))v=+v; cfg[d.k]=v; LS.set(K.cfg,cfg); applyTheme(); render(); };
actions.saveSrc = async () => { cfg.sources={phr:$('#srcP').value.trim(),voc:$('#srcV').value.trim()}; LS.set(K.cfg,cfg); toast('Loading…');
  const r=await Promise.allSettled([loadDeck('phr',{force:true}),loadDeck('voc',{force:true})]);
  toast(r.every(x=>x.status==='fulfilled')?'Both sheets loaded.':'One sheet failed. Check the link is published as TSV.'); };
actions.resetSrc = () => { cfg.sources={...DEFAULT_SOURCES}; LS.set(K.cfg,cfg); render(); };
function importText(text){ const d=cfg.importDeck||'phr', items=(d==='phr'?parsePhr:parseVoc)(text.includes('\t')?text:text.replace(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/g,'\t').replace(/"/g,''));
  if(!items.length) return toast('No rows found. Include the header row.'); data[d]={items,at:Date.now()}; LS.set(K.data,data); toast(`Imported ${items.length} ${DECKS[d].short.toLowerCase()} items`); }
actions.importTsv = () => importText($('#tsv').value);
const progressBlob = () => JSON.stringify({v:2, at:Date.now(), srs, log});
actions.exportP = () => copy(progressBlob(), 'Progress code copied');
actions.downloadP = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([progressBlob()],{type:'application/json'})); a.download=`business-english-progress-${today()}.json`; a.click(); toast('Backup saved'); };
function mergeProgress(text){ try{ const p=JSON.parse(text); let n=0;
  Object.entries(p.srs||{}).forEach(([k,c])=>{ if(!srs[k] || (c.last||0)>(srs[k].last||0)){ srs[k]=c; n++; } });
  Object.entries(p.log||{}).forEach(([d,v])=>{ const m=log[d]; if(!m||v.rev>m.rev) log[d]=v; });
  LS.set(K.srs,srs); LS.set(K.log,log); toast(`Merged: ${n} cards updated`); render(); }catch(e){ toast('That code is not valid progress data.'); } }
actions.importP = () => mergeProgress($('#imp').value.trim());
actions.wipe = () => { if(!st.wipeArm){ st.wipeArm=true; return render(); } srs={}; log={}; LS.set(K.srs,srs); LS.set(K.log,log); st.wipeArm=false; toast('Progress erased'); render(); };

// ---------- 11. Wiring after each render ----------
function afterRender(){
  const s=$('#search'); if(s){ s.oninput=()=>{ st.q=s.value; const pos=s.selectionStart; render(); const n=$('#search'); n.focus(); n.setSelectionRange(pos,pos); }; }
  const f=$('#typeForm'); if(f){ f.onsubmit=e=>{e.preventDefault(); actions.typeCheck();}; setTimeout(()=>$('#ans')?.focus(),60);
    const inp=$('#ans'); if(inp.tagName==='TEXTAREA') inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); actions.typeCheck(); } };
    inp.oninput=()=>{ const S=st.S; if(!S||S.sub?.locked) return; if(check1(inp.value, bestTarget(inp.value, typeTarget(cur())))==='exact') actions.typeCheck(); }; }
  const tf=$('#tsvFile'); if(tf) tf.onchange=()=>{ const r=new FileReader(); r.onload=()=>importText(r.result); r.readAsText(tf.files[0]); };
  const jf=$('#impFile'); if(jf) jf.onchange=()=>{ const r=new FileReader(); r.onload=()=>mergeProgress(r.result); r.readAsText(jf.files[0]); };
  if(st.view==='session' && st.S){ const S=st.S, it=list()[S.i];
    if(cfg.autoSpeak && it && ((S.step==='sort'&&cfg.dir==='en-ru'&&!S.flipped) || S.step==='learn')) speak(it.en);
    if(cfg.autoSpeak && S.step==='sentence' && S.sub && !S.sub.spoken){ S.sub.spoken=true; setTimeout(()=>speak(S.sub.target),250); } }
}
// Laptop shortcuts
document.addEventListener('keydown', e => {
  if(st.view!=='session'||!st.S||e.target.matches('input,textarea')) return;
  const S=st.S;
  if(S.step==='sort'){ if(e.code==='Space'){ e.preventDefault(); actions.flip(); } else if('1234'.includes(e.key)) actions.grade({g:['again','hard','good','easy'][+e.key-1]}); }
  else if(S.step==='match' && '1234'.includes(e.key)){ const b=document.querySelectorAll('.opt')[+e.key-1]; if(b&&!b.disabled) actions.pick({n:+e.key-1}, b); }
  else if((S.step==='learn'||S.step==='dialogue') && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); advance(); }
});

// ---------- Skip & exit ----------
actions.skipItem = () => { const S=st.S, it=cur(); if(!it||S.sub?.locked) return; S.skipped.add(it); advance(); };
function openExit(){

  const S=st.S, rest=S.steps.filter(x=>x!=='summary'), k=rest.indexOf(S.step), hasNext=k>-1&&k<rest.length-1;

// ---------- Bullet: 60-second right/wrong sprint (Vocabulary only, not part of the lesson) ----------
const BULLET_SEC=60;
const bestBullet = d => LS.get('bet.bullet.'+d, 0);
function startBullet(){
  const p=pool(); if(p.length<2) return toast('Bullet needs at least 2 chunks in this filter.');
  newSession({ kind:'bullet', items:[], steps:['bullet','summary'], b:{ deck:shuffle(p), k:0, score:0, total:0, streak:0, best:0, wrong:[], end:0 } });
}
function bulletCard(){
  const b=st.S.b, all=pool(); if(b.k>=b.deck.length){ b.deck=shuffle(b.deck); b.k=0; }
  const it=b.deck[b.k++], truth=Math.random()<.5;
  let shown=it.ru;
  if(!truth){ const same=all.filter(x=>x!==it&&x.ru!==it.ru&&x.cat===it.cat), others=same.length?same:all.filter(x=>x!==it&&x.ru!==it.ru); if(others.length) shown=others[Math.floor(Math.random()*others.length)].ru; }
  b.cur={it, shown, ok:shown===it.ru};
}
function vBullet(){
  const S=st.S, b=S.b; bar(0);
  if(!b.end) return `<div class="bullet-intro">
      <div class="phrase" style="font-size:2rem">Bullet</div>
      <p class="muted" style="margin:6px 0 0">${BULLET_SEC} seconds. A chunk and a translation appear. Decide if the translation is right.</p>
      <div class="bullet-keys"><span><b>←</b> Wrong</span><span>Right <b>→</b></span></div>
      <p class="hint" style="margin:0">Swipe, tap the buttons, or use arrow keys. Best: ${bestBullet(st.deck)}</p></div>
    <div class="actions"><button class="btn" data-act="bulletGo">Start</button></div>`;
  const left=Math.max(0,Math.ceil((b.end-Date.now())/1000));
  return `<div class="bullet-head"><span class="bullet-time" id="bTime">${left}</span><span class="bullet-score"><b id="bScore">${b.score}</b> correct${b.streak>2?` · <span class="bullet-streak">${b.streak} in a row</span>`:''}</span></div>
    <div class="bullet-clock"><i id="bClock" style="width:${left/BULLET_SEC*100}%"></i></div>
    <div class="bcard" id="bcard">
      <div class="phrase">${esc(b.cur.it.en)}</div>
      <div class="bcard-rule"></div>
      <div class="bcard-ru">${esc(b.cur.shown)}</div>
    </div>
    <div class="actions bullet-actions">
      <button class="btn bno" data-act="bulletAns" data-v="0"><span aria-hidden="true">←</span> Wrong</button>
      <button class="btn byes" data-act="bulletAns" data-v="1">Right <span aria-hidden="true">→</span></button></div>`;
}
actions.bulletGo = () => { const b=st.S.b; b.end=Date.now()+BULLET_SEC*1000; bulletCard(); render(); startBulletTimer(); };
actions.bulletAns = d => {
  const S=st.S, b=S.b; if(!b.end||Date.now()>b.end||b.lock) return;
  const said=d.v==='1', right=said===b.cur.ok; b.total++; markActive();
  if(right){ b.score++; b.streak++; b.best=Math.max(b.best,b.streak); }
  else { b.streak=0; buzz(); if(!b.wrong.includes(b.cur.it)) b.wrong.push(b.cur.it); S.misses.add(b.cur.it); }
  const c=$('#bcard'); b.lock=true;
  if(c){ c.classList.add(right?'hit':'miss', said?'go-r':'go-l'); }
  setTimeout(()=>{ b.lock=false; if(Date.now()<b.end){ bulletCard(); render(); } }, right?140:420);
};
function startBulletTimer(){ stopBulletTimer(); st.bTimer=setInterval(()=>{
  const b=st.S?.b; if(!b){ return stopBulletTimer(); }
  const ms=b.end-Date.now(), t=$('#bTime'), k=$('#bClock');
  if(t) t.textContent=Math.max(0,Math.ceil(ms/1000)); if(k) k.style.width=Math.max(0,ms/(BULLET_SEC*10))+'%';
  if(t && ms<=10000) t.classList.add('low');
  if(ms<=0){ stopBulletTimer(); finishBullet(); }
},200); }
function stopBulletTimer(){ if(st.bTimer){ clearInterval(st.bTimer); st.bTimer=null; } }
function finishBullet(){ const S=st.S, b=S.b; b.prevBest=bestBullet(st.deck); if(b.score>b.prevBest) LS.set('bet.bullet.'+st.deck,b.score); S.step='summary'; render(); window.scrollTo(0,0); }
function vBulletSummary(){
  bar(100); const b=st.S.b, acc=b.total?Math.round(b.score/b.total*100):0, rec=b.score>b.prevBest&&b.score>0;
  return `<div class="summary-hero">
    <div class="n">${b.score}</div><h2 style="margin:10px 0 4px;font-size:1.25rem">correct in ${BULLET_SEC} seconds</h2>
    <p class="muted" style="margin:0">${rec?'New best. ':`Best ${Math.max(b.prevBest,b.score)}. `}${b.total} answered, ${acc}% accurate, longest run ${b.best}</p></div>
  ${b.wrong.length?`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Got wrong</div>${b.wrong.map(it=>`<div class="dict-row"><div class="meta"><b>${esc(it.en)}</b><div class="muted">${esc(it.ru)}</div></div>${audioBtn(it.en)}</div>`).join('')}</div>`:''}
  <div class="actions" style="flex-direction:column">
    <button class="btn" data-act="bulletAgain">Play again</button>
    ${b.wrong.length?`<button class="btn ghost" data-act="retry">Practise mistakes (type them)</button>`:''}
    <button class="btn ghost" data-act="back">Back to deck</button></div>`;
}
actions.bulletAgain = () => startBullet();
// arrows + swipe
document.addEventListener('keydown', e => { if(st.S?.step!=='bullet'||st.view!=='session'||$('#exitSheet')) return;
  if(!st.S.b.end && (e.key==='Enter'||e.code==='Space')){ e.preventDefault(); return actions.bulletGo(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); actions.bulletAns({v:'0'}); } if(e.key==='ArrowRight'){ e.preventDefault(); actions.bulletAns({v:'1'}); } });
let bx=null; document.addEventListener('touchstart', e => { if(st.S?.step==='bullet' && e.target.closest('#bcard')) bx=e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => { if(bx===null) return; const dx=e.changedTouches[0].clientX-bx; bx=null; if(Math.abs(dx)>50) actions.bulletAns({v:dx>0?'1':'0'}); });
render();
</script>
</body>
